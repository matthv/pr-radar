name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.js
      # Tag and GitHub release only, nothing committed back: main is protected.
      - run: npx --yes semantic-release@24.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
