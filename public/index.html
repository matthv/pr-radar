  + '<path fill="#36C5F0" d="M47 27c-7.3 0-13.2-5.9-13.2-13.2C33.8 6.5 39.7.6 47 .6c7.3 0 13.2 5.9 13.2 13.2V27H47zm0 6.7c7.3 0 13.2 5.9 13.2 13.2 0 7.3-5.9 13.2-13.2 13.2H13.9C6.6 60.1.7 54.2.7 46.9c0-7.3 5.9-13.2 13.2-13.2H47z"/>'
  + '<path fill="#2EB67D" d="M99.9 46.9c0-7.3 5.9-13.2 13.2-13.2 7.3 0 13.2 5.9 13.2 13.2 0 7.3-5.9 13.2-13.2 13.2H99.9V46.9zm-6.6 0c0 7.3-5.9 13.2-13.2 13.2-7.3 0-13.2-5.9-13.2-13.2V13.8C66.9 6.5 72.8.6 80.1.6c7.3 0 13.2 5.9 13.2 13.2v33.1z"/>'
  + '<path fill="#ECB22E" d="M80.1 99.8c7.3 0 13.2 5.9 13.2 13.2 0 7.3-5.9 13.2-13.2 13.2-7.3 0-13.2-5.9-13.2-13.2V99.8h13.2zm0-6.6c-7.3 0-13.2-5.9-13.2-13.2 0-7.3 5.9-13.2 13.2-13.2h33.1c7.3 0 13.2 5.9 13.2 13.2 0 7.3-5.9 13.2-13.2 13.2H80.1z"/>'
  + '</svg>';
// The Linear mark (Simple Icons), filled from a token: brand indigo, white in dark mode.
const LINEAR_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.886 4.18A11.982 11.982 0 0 1 11.99 0C18.624 0 24 5.376 24 12.009c0 3.64-1.62 6.903-4.18 9.105L2.887 4.18ZM1.817 5.626l16.556 16.556c-.524.33-1.075.62-1.65.866L.951 7.277c.247-.575.537-1.126.866-1.65ZM.322 9.163l14.515 14.515c-.71.172-1.443.282-2.195.322L0 11.358a12 12 0 0 1 .322-2.195Zm-.17 4.862 9.823 9.824a12.02 12.02 0 0 1-9.824-9.824Z"/></svg>';

const CLAUDE_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="#D97757" stroke-width="2.6"'
  + ' stroke-linecap="round" d="M12 2.5v19M2.5 12h19M5.3 5.3l13.4 13.4M18.7 5.3 5.3 18.7"/></svg>';

function whoHtml(pr) {
  const people = pr.contributors ?? [];
  if (!people.length) return '';

  const shown = people.slice(0, MAX_FACES);
  const hidden = people.length - shown.length;
  // Same behaviour as gitdeck: the face links to the GitHub profile. Every contributor
  // here has a login by construction — `contributorsOf` skips users without one — so
  // the link can never point at a page that does not exist.
  const faces = shown
    .map(
      person =>
        `<a class="face" href="https://github.com/${encodeURIComponent(person.login)}"`
        + ` target="_blank" rel="noopener"`
        + ` title="${escapeHtml(t('openProfile', { login: person.login }))}">`
        + (person.avatarUrl
          ? `<img src="${escapeHtml(person.avatarUrl)}&s=48" alt="" loading="lazy">`
          : '')
        + '</a>',
    )
    .join('');

  const names = shown.map(person => escapeHtml(person.login)).join(', ');

  return `<span class="sep who" title="${escapeHtml(people.map(p => p.login).join(' → '))}">`
    + `<span class="stack">${faces}</span>`
    + `<span>${names}${hidden ? ` +${hidden}` : ''}</span></span>`;
}

function ciPill(pr) {
  // ciState is the head commit's own checks — the feature branch's, run before the
  // merge. Once merged, that commit lives on no branch any more, and the pill sat next
  // to the merge commit's own outcome pill without saying it was a different thing: a
  // static green "CI ✓" from before the merge, beside a card still breathing amber
  // because the merge commit's own pipeline hasn't finished — read as a contradiction.
  if (pr.merged) return '';

  const map = {
    SUCCESS: ['good', 'ciOk'],
    FAILURE: ['alert', 'ciFail'],
    ERROR: ['alert', 'ciFail'],
    PENDING: ['', 'ciRunning'],
    EXPECTED: ['', 'ciRunning'],
  };
  const entry = map[pr.ciState];
  if (!entry) return '';
  return freshOn(pr, 'ciFailed') ? pill(`${entry[0]} fresh`, t(entry[1]), t('sinceFreshTitle')) : pill(entry[0], t(entry[1]));
}

function threadHtml(thread) {
  const file = thread.path ? thread.path.split('/').pop() : null;
  // Three channels, three places a remark can live: a line of code, the review itself,
  // or the PR conversation. Both synthetic ones have no path, so the channel says which.
  const label = file
    ? escapeHtml(file) + (thread.line ? ':' + thread.line : '')
    : t(thread.channel === 'review' ? 'reviewNote' : 'conversation');
  return `
    <div class="thread">
      <div class="thread-head">
        <span class="thread-author">${escapeHtml(thread.author)}</span>
        <a class="thread-path" href="${escapeHtml(thread.url)}" target="_blank" rel="noreferrer"
           title="${escapeHtml(thread.path || '')}">${label}</a>
        ${thread.isOutdated ? pill('', t('outdated')) : ''}
        ${thread.commentCount > 1 ? `<span>${t('messages', { n: thread.commentCount })}</span>` : ''}
        <span>${t('lastWord', {
          who: escapeHtml(thread.lastByMe ? t('me') : thread.lastAuthor),
          ago: since(thread.lastAt),
        })}</span>
      </div>
      <div class="thread-body">${escapeHtml(thread.excerpt)}${
        thread.excerptTruncated
          ? ` <a class="thread-more" href="${escapeHtml(thread.url)}" target="_blank" rel="noopener">${t('readRest')}</a>`
          : ''
      }</div>
    </div>`;
}

// On a merged PR the release outcome owns the card's colour, overriding the bucket:
// the bucket says whose move it is, but here what matters is whether the release landed.
// pipelineOutcome is computed server-side (github.js), not re-derived here, so this and
// the sort order in byActionThenFreshness cannot read the same commit two different ways.
function pipelineClass(pr) {
  if (!pr.merged) return '';
  if (pr.pipelineOutcome === 'failed') return ' pipeline-failed';
  if (pr.pipelineOutcome === 'done') return ' pipeline-done';
  if (pr.pipelineOutcome === 'running') return ' pipeline-running';
  // 'none': no check was ever posted to this merge commit, and none ever will be —
  // merging into a branch with no CI on push, say. `.card.merged` alone is amber, meant
  // as a transient default always meant to be overridden — left unstyled here it read as
  // "still waiting on someone", the opposite of settled. Painted the same green as a
  // landed release: nothing is pending either way, only the pill beside it differs.
  return ' pipeline-none';
}

// The chime says something landed on your plate, not which card: those that just did keep
// their rail glowing for two minutes, so a glance finds them. Same rule as the chime, per
// card — entered "to act" since the last render, filters applied, never on the first
// render. Independent of the mute button: a silent board is where it helps most.
const GLOW_MS = 2 * 60 * 1000;
const GLOW_FADE_MS = 10 * 1000;
const GLOW_PULSE_S = 2.4;
let glowTimer = null;

function trackGlow(actionIds) {
  const now = Date.now();
  const current = new Set(actionIds);
  const arrived = new Set();
  if (state.lastActionIds) {
    for (const id of current) {
      if (state.lastActionIds.has(id)) continue;
      state.glow.set(id, document.hidden ? null : now + GLOW_MS);
      arrived.add(id);
    }
  }
  // A card that left "to act" — you answered — has nothing left to point at.
  for (const id of state.glow.keys()) if (!current.has(id)) state.glow.delete(id);
  state.lastActionIds = current;
  scheduleGlowExpiry();
  return arrived;
}

function scheduleGlowExpiry() {
  clearTimeout(glowTimer);
  const ends = [...state.glow.values()].filter(Boolean);
  if (!ends.length) return;
  const next = Math.min(...ends);
  // Wake once to start the fade, once more to drop the class: no timer runs in between.
  const fadeAt = next - GLOW_FADE_MS;
  glowTimer = setTimeout(() => {
    const now = Date.now();
    for (const [id, until] of state.glow) if (until && until <= now) state.glow.delete(id);
    render();
  }, Math.max(0, (Date.now() < fadeAt ? fadeAt : next) - Date.now()) + 20);
}

function stopGlow(card) {
  if (!card || !state.glow.has(card.dataset.id)) return;
  state.glow.delete(card.dataset.id);
  card.classList.remove('glow', 'glow-ending');
  scheduleGlowExpiry();
}

// Rendered as negative delays: render() rebuilds every card, and an animation restarting
// at its first frame on each refresh would visibly jump.
function glowAttrs(pr) {
  const until = state.glow.get(pr.id);
  if (!until) return { cls: '', style: '' };
  const left = until - Date.now();
  const elapsed = GLOW_MS - left;
  if (left <= GLOW_FADE_MS) {
    return { cls: ' glow glow-ending', style: ` style="--glow-fade-elapsed: -${((GLOW_FADE_MS - left) / 1000).toFixed(2)}s"` };
  }
  return { cls: ' glow', style: ` style="--glow-elapsed: -${((elapsed / 1000) % GLOW_PULSE_S).toFixed(2)}s"` };
}

// The board's own org needs no owner; a repo added through PR_RADAR_EXTRA_REPOS does, or
// `pr-radar` would read as one of the org's.
// GitHub's `org:` ignores case, `pr.repo` carries the org's own spelling.
const isExternal = repo =>
  Boolean(state.data?.org) && !repo.toLowerCase().startsWith(`${state.data.org.toLowerCase()}/`);
const repoName = repo => (isExternal(repo) ? repo : repo.replace(/^.*\//, ''));
// The class and inline variables a repo's coloured element takes; empty for the default cyan.
function repoTint(repo) {
  const tint = repoColors.get(repo);
  return tint ? { cls: ' tinted', style: ` style="--repo-h:${Number(tint.h)};--repo-c:${Number(tint.c)}"` } : { cls: '', style: '' };
}
const repoDot = repo => {
  const tint = repoTint(repo);
  return tint.cls ? `<span class="repo-dot"${tint.style}></span>` : '';
};

const repoChip = pr => {
  const tint = repoTint(pr.repo);
  return `<span class="repo${tint.cls}"${tint.style}>${escapeHtml(repoName(pr.repo))} #${pr.number}</span>`;
};

const changesOf = pr => PRRadarSince.changesSince(state.seen?.[pr.id], pr, state.data.me);

// A change a reason already says word for word: marked new on the reason instead of said
// twice. The reason stays once seen — it is why the card is here — and only its mark goes.
const SAID_BY_REASON = {
  changesRequested: pr => pr.side === 'mine' && pr.reasons.some(r => r.kind === 'changes-requested'),
  pushed: pr => pr.side === 'review' && pr.reasons.some(r => r.kind === 'recheck'),
};
// A pill only gives the state; that it is news is still said on the line, and the pill gets
// a dot in its own colour to point at it.
const SHOWN_BY_PILL = {
  ciFailed: pr => !pr.merged && (pr.ciState === 'FAILURE' || pr.ciState === 'ERROR'),
  conflict: pr => pr.side === 'mine' && pr.mergeable === 'CONFLICTING',
  releaseFailed: pr => pr.merged && pr.pipelineOutcome === 'failed',
};
const freshOn = (pr, kind) =>
  Boolean((SAID_BY_REASON[kind] ?? SHOWN_BY_PILL[kind])?.(pr)) && changesOf(pr).some(change => change.kind === kind);
const freshBadge = () => `<span class="fresh-badge">${escapeHtml(t('sinceFresh'))}</span>`;

function sincePhrase(change) {
  const who = (change.who ?? []).join(', ');
  switch (change.kind) {
    case 'commented': return tn('sinceCommented', change.who.length, { who });
    case 'approved': return t('sinceApproved', { who });
    case 'changesRequested': return t('sinceChangesRequested', { who });
    case 'pushed': return t('sincePushed', { who });
    case 'ciFailed': return t('sinceCiFailed');
    case 'ciPassed': return t('sinceCiPassed');
    case 'conflict': return t('sinceConflict');
    case 'merged': return t('sinceMerged');
    case 'released': return t('sinceReleased', { tag: change.tag });
    case 'releaseFailed': return t('sinceReleaseFailed');
    default: return change.kind;
  }
}

const SINCE_SHOWN = 2;

// One block for why the card is here and what moved on it: the reasons first, then what is
// new since you looked as its last entry. What asks for something leads that entry; the
// list under it says everything, latest first, with when. A CI or a conflict has no moment
// of its own in the data: it heads the list as is.
function reasonsHtml(pr) {
  const fresh = freshOn(pr, 'changesRequested') || freshOn(pr, 'pushed');
  const rows = pr.displayReasons.map(r => `<div class="reason">${escapeHtml(r)}${fresh ? freshBadge() : ''}</div>`);

  const changes = changesOf(pr).filter(change => !SAID_BY_REASON[change.kind]?.(pr));
  if (changes.length) {
    const hidden = changes.length - SINCE_SHOWN;
    const open = hidden > 0 && state.sinceOpen.has(pr.id);
    const when = change => (change.at ? `${sincePhrase(change)} — ${t('sinceAgo', { v: ago(change.at) })}` : sincePhrase(change));
    const toggle = hidden > 0
      ? ` <button type="button" class="since-toggle" data-since="${escapeHtml(pr.id)}" aria-expanded="${open}">`
        + `${open ? '▾' : '▸'} ${escapeHtml(t('sinceMore', { n: hidden }))}</button>`
      : '';
    rows.push(`<div class="reason since" title="${escapeHtml(changes.map(when).join('\n'))}"><span>`
      + `<span class="since-lead">${escapeHtml(t('sinceLead'))}</span> `
      + `${changes.slice(0, SINCE_SHOWN).map(change => escapeHtml(sincePhrase(change))).join(' · ')}${toggle}</span></div>`);
    if (open) {
      const byTime = [...changes].sort((a, b) => (b.at ?? '\uffff').localeCompare(a.at ?? '\uffff'));
      rows.push(`<ul class="since-list">${byTime.map(change => `<li><span>${escapeHtml(sincePhrase(change))}</span>`
        + `<span class="since-at">${change.at ? escapeHtml(t('sinceAgo', { v: ago(change.at) })) : ''}</span></li>`).join('')}</ul>`);
    }
  }
  return rows.length ? `<div class="reasons">${rows.join('')}</div>` : '';
}

function linearLink(pr) {
  const base = state.data?.linearUrl;
  if (!pr.ticket || !base) return '';
  return `<a class="linear-link" href="${escapeHtml(`${base}/issue/${encodeURIComponent(pr.ticket)}`)}"`
    + ` target="_blank" rel="noopener" title="${escapeHtml(t('ticketTitle', { key: pr.ticket }))}">`
    + `${LINEAR_ICON}<span>${escapeHtml(pr.ticket)}</span></a>`;
}

function cardHtml(pr, threadsToShow, extraPills) {
  const open = state.open.has(pr.id) ? ' open' : '';
  const count = threadsToShow.length;
  const note = cardNotes.get(pr.id);
  const editingNote = state.editingNote === pr.id;
  const glow = glowAttrs(pr);

  return `
    <div class="card ${pr.bucket}${pipelineClass(pr)}${pr.approved ? ' approved' : ''}${state.snoozed.has(pr.id) ? ' snoozed' : ''}${editingNote ? ' editing-note' : ''}${glow.cls}${open}" data-id="${pr.id}"${glow.style}>
      <div class="card-top">
        ${repoChip(pr)}
        <a class="title" href="${escapeHtml(pr.url)}" target="_blank" rel="noreferrer">${escapeHtml(pr.title)}</a>
        <span class="age" title="${t('openedTitle', { date: onDate(pr.createdAt) })}">${t('opened', { v: ago(pr.createdAt) })}</span>
      </div>
      <div class="meta">
        ${pr.isDraft ? pill('draft', t('pillDraft')) : ''}
        ${extraPills.join('')}
        ${ciPill(pr)}
        ${pr.side === 'mine' && pr.mergeable === 'CONFLICTING'
          ? (freshOn(pr, 'conflict') ? pill('alert fresh', t('pillConflicts'), t('sinceFreshTitle')) : pill('alert', t('pillConflicts')))
          : ''}
        <span>+${pr.additions}/−${pr.deletions} · ${t('files', { n: pr.changedFiles })}</span>
        <span class="sep" title="${t('agoTitle')}">${t('activeAgo', { v: ago(pr.lastActivityAt) })}</span>
        ${whoHtml(pr)}
      </div>
      ${reasonsHtml(pr)}
      <div class="card-foot">
        ${count ? `<button type="button" class="expander">${open ? '▾' : '▸'} ${tn('threads', count)}</button>` : '<span></span>'}
        <div class="card-actions">
          <button type="button" class="note-btn${note ? ' has-note' : ''}"
            title="${escapeHtml(t(note ? 'noteTitleEdit' : 'noteTitleAdd'))}" data-note="${pr.id}">${NOTE_ICON}</button>
          <button type="button" class="snooze" title="${t('snooze')}" data-snooze="${pr.id}">${state.snoozed.has(pr.id) ? `${PAUSE} ${t('snoozedBadge')}` : PAUSE}</button>
          ${linearLink(pr)}
          ${pr.claudeSession
            ? `<button type="button" class="claude-link${resuming.has(pr.id) ? ' busy' : ''}" data-claude="${pr.id}" title="${escapeHtml(t('claudeTitle'))}">${CLAUDE_ICON}</button>`
            : ''}
          ${pr.slackUrl
            ? `<a class="slack-link" href="${escapeHtml(pr.slackUrl)}" target="_blank" rel="noopener"`
              + ` title="${escapeHtml(t('slackTitle'))}">${SLACK_ICON}</a>`
            : ''}
        </div>
      </div>
      ${editingNote
        ? `<div class="note-editor"><textarea placeholder="${escapeHtml(t('notePlaceholder'))}">${escapeHtml(note)}</textarea></div>`
        : note
          ? `<div class="note-text">${linkifyNote(note)}</div>`
          : ''}
      ${count ? `<div class="threads">${threadsToShow.map(threadHtml).join('')}</div>` : ''}
    </div>`;
}

// Classification belongs to the server; these two add only what needs the chosen
// language or the palette. They used to recompute `needsAction` and `bucket` because the
// "hide bots" filter changed the inputs underneath — without it, recomputing would be a
// second copy of the same rules, free to drift from the first.
function resolveMine(pr) {
  return {
    ...pr,
    waiting: pr.waitingOnThem,
    // The pills already say the remark count, the CI and the conflicts: only the name of
    // the reviewer who requested changes adds something found nowhere else.
    displayReasons: pr.reasons
      .filter(r => r.kind === 'changes-requested')
      .map(r => t('reasonChangesRequested', { authors: r.authors.join(', ') })),
    // My approved PRs have their own group now ("ready to merge"), never a green "idle".
    approved: false,
  };
}

function resolveReview(pr) {
  // Bot threads never enter answered/awaiting — I have not taken part in them — so on the
  // review side they would be entirely invisible. Grouped per bot: 29 remarks from a
  // linter and 29 from a review bot do not call for the same thing.
  const botsByLogin = new Map();
  for (const thread of pr.threads) {
    if (!thread.fromBot || thread.isResolved) continue;
    const login = thread.author.replace(/\[bot\]$/, '');
    botsByLogin.set(login, (botsByLogin.get(login) ?? 0) + 1);
  }

  return {
    ...pr,
    answered: pr.answeredToMe,
    awaiting: pr.awaitingAuthor,
    bots: [...botsByLogin.entries()]
      .map(([login, count]) => ({ login, count }))
      .sort((a, b) => b.count - a.count),
    displayReasons: pr.reasons.some(r => r.kind === 'recheck') ? [t('reasonRecheck')] : [],
    approved: pr.bucket === 'idle' && pr.myLatestVerdict === 'APPROVED',
  };
}

// A merge into anything but the repo's default branch has not shipped, whatever the
// pipeline says — a stacked feature branch can carry a green, settled-looking outcome of
// its own. `mergeTarget` is only ever the branch name, computed server-side, and only
// when it differs from the default; shared by both sides so a reviewed PR's card cannot
// say something different from one's own.
function mergeTargetBadge(pr) {
  if (!pr.merged || !pr.mergeTarget) return '';
  // The raw name, unedited — a thread's file path never gets rewritten either, and a
  // stripped `feature/` prefix would silently misrepresent a `hotfix/` or `release/`
  // branch the same shortcut does not apply to.
  return `<span class="branch-badge" title="${escapeHtml(t('mergedIntoTitle', { branch: pr.mergeTarget }))}">`
    + `${escapeHtml(pr.mergeTarget)}</span>`;
}

// The pills a card wears, extracted so the orbit view's hover card cannot drift from
// them: one PR, one set of pills, whichever view is drawing it.
// Shared by both sides: a merge's outcome is the same fact whichever column shows it, and
// this used to exist only in minePills — a reviewed PR's card had nothing to read once
// ciPill stopped covering for it, just a background breathing amber with no word for why.
function mergeOutcomePills(pr) {
  const pills = [
    `<span title="${escapeHtml(t('mergedTitle', { date: onDate(pr.mergedAt) }))}">`
    + `${t('pillMergedAgo', { v: ago(pr.mergedAt) })}</span>${mergeTargetBadge(pr)}`,
  ];
  // Four outcomes: broken, published, still running, or no signal at all. That last
  // one is not "running" — nothing was ever posted to this merge commit, and nothing
  // ever will be, so no pill claims a decision is imminent when none is coming. And on
  // a stacked branch, "done" only ever means the branch's own checks passed, never that
  // a release went out — forest-rails#803 had real green checks yet sat nowhere near
  // main, so the badge above already says what needs saying and this pill stays quiet.
  if (pr.pipelineOutcome === 'failed') {
    // Named after the workflow that broke, linking to its run: "release failed" said the
    // same thing of a broken notifier and of a broken deploy.
    const failure = pr.pipelineFailure;
    const label = failure?.workflow ? t('pipelineFailedNamed', { workflow: failure.workflow }) : t('pipelineFailed');
    pills.push(failure?.url
      ? `<a class="pill alert${freshOn(pr, 'releaseFailed') ? ' fresh' : ''}" href="${escapeHtml(failure.url)}" target="_blank" rel="noopener"`
        + ` title="${escapeHtml(t('pipelineFailedTitle'))}">${escapeHtml(label)}</a>`
      : pill(freshOn(pr, 'releaseFailed') ? 'alert fresh' : 'alert', escapeHtml(label)));
  } else if (pr.pipelineOutcome === 'done' && !pr.mergeTarget) {
    pills.push(
      pr.release
        ? `<a class="pill good" href="${escapeHtml(pr.release.url)}" target="_blank" rel="noopener"`
          + ` title="${escapeHtml(t('releaseTag'))}">${escapeHtml(pr.release.tag)}</a>`
        : pill('good', t('pipelineDone')),
    );
  } else if (pr.pipelineOutcome === 'running') {
    pills.push(`<span class="pill pending running">${t('pipelineRunning')}</span>`);
  }
  return pills;
}

function minePills(pr) {
  const pills = pr.merged ? mergeOutcomePills(pr) : [];
  // A PR opened by someone else only lands here because I took it over: unsaid, its
  // presence in "my PRs" is unexplainable.
  if (pr.author !== state.data.me) pills.push(pill('', t('pillTakenOver', { author: pr.author })));
  if (!pr.merged && pr.toFix.length) pills.push(pill('todo', t('pillToFix', { n: pr.toFix.length })));
  if (!pr.merged && pr.reviewDecision === 'APPROVED') pills.push(pill('good', t('pillApproved')));
  if (!pr.merged && pr.waiting.length) pills.push(pill('pending', t('pillWaitingReply', { n: pr.waiting.length })));
  return pills;
}

function mineCard(pr) {
  return cardHtml(pr, [...pr.toFix, ...pr.waiting], minePills(pr));
}

function reviewPills(pr) {
  // Same outcome pills as my own merges — a merge commit's pipeline is the same fact
  // whichever side reviews it. Used to stop at the age line here, on the idea that a
  // verdict pill ("I approved") still said something once merged; it never said whether
  // the release had landed, so a card could only breathe amber with no word for why.
  const pills = pr.merged ? mergeOutcomePills(pr) : [];
  if (pr.reviewOwedByMe && !pr.iHaveReviewed) pills.push(pill('todo', t('pillToReview')));
  if (pr.answered.length) pills.push(pill('todo', tn('pillAnswers', pr.answered.length)));
  if (pr.awaiting.length) pills.push(pill('pending', t('pillAwaitingFix', { n: pr.awaiting.length })));
  if (pr.myLatestVerdict === 'CHANGES_REQUESTED') pills.push(pill('pending', t('pillIRequested')));
  if (pr.myLatestVerdict === 'APPROVED') pills.push(pill('good', t('pillIApproved')));
  // When the card already carries the "new commits…" line, the pill merely repeats it.
  if (pr.pushedSinceMyFeedback && !pr.displayReasons.length) pills.push(pill('', t('pillPushed')));
  // Neutral: a bot having plenty to say is context, not something asked of me.
  for (const bot of pr.bots.slice(0, MAX_BOT_PILLS)) {
    pills.push(pill(
      '',
      `${escapeHtml(bot.login)} ${bot.count}`,
      tn('pillBotTitle', bot.count, { login: bot.login }),
    ));
  }
  return pills;
}

function reviewCard(pr) {
  return cardHtml(pr, [...pr.answered, ...pr.awaiting], reviewPills(pr));
}

// Clicking a counter isolates its set: the relevant column goes full width, the other
// disappears. One at a time — these are competing views of the same board, not filters
// that stack.
function filterList(list) {
  let filtered = list;
  if (!state.revealSnoozed) filtered = filtered.filter(pr => !state.snoozed.has(pr.id));
  if (state.repo) filtered = filtered.filter(pr => pr.repo === state.repo);
  if (state.data?.hideDrafts) filtered = filtered.filter(pr => !pr.isDraft);
  return filtered;
}

const FOCUS = {
  mineAction: { column: 'mine', bucket: 'action' },
  mineReady: { column: 'mine', bucket: 'ready' },
  reviewAction: { column: 'reviews', bucket: 'action' },
  reviewWaiting: { column: 'reviews', bucket: 'waiting' },
};

// Ordered by what each state asks of you: your move, then waiting on someone, then a
// merge to glance at, then nothing. A merge sat second before, which ranked a published
// release above a PR actually blocked on a reviewer.
// "Ready to merge" sits right under "to act": it is a move of mine too, and below the
// merged group it read as already done.
const BUCKET_ORDER = ['action', 'ready', 'waiting', 'merged', 'idle'];

function renderColumn(target, list, cardFn, groupLabels, emptyLabel, onlyBucket) {
  const filtered = filterList(list).filter(pr => !onlyBucket || pr.bucket === onlyBucket);
  if (!filtered.length) {
    target.innerHTML = `<div class="empty">${emptyLabel}</div>`;
    return [];
  }
  const groups = BUCKET_ORDER
    .map(bucket => [bucket, filtered.filter(pr => pr.bucket === bucket)])
    .filter(([, group]) => group.length);

  target.innerHTML = groups
    .map(([bucket, group]) => {
      // A summary reports the state that still needs attention: the merged group turns
      // green once nothing in it is still deciding. A failed one is not here — it moves
      // to the action group; a merge with no CI signal at all settles immediately too,
      // since it is never going to produce one.
      const settled = bucket === 'merged' && group.every(pr => pr.pipelineOutcome !== 'running');
      const key = `${target.id}:${bucket}`;
      const collapsed = collapsedGroups.has(key);
      return `<button type="button" class="group-label ${bucket}${settled ? ' settled' : ''}`
        + `${collapsed ? ' collapsed' : ''}" data-group="${key}" aria-expanded="${!collapsed}">`
        + `<span class="gdot"></span>${groupLabels[bucket]}`
        + `<span class="gcount">${group.length}</span><span class="gchev"></span></button>`
        + `<div class="group-cards">${group.map(cardFn).join('')}</div>`;
    })
    .join('');

  return groups.flatMap(([, group]) => group);
}

function repoOptions() {
  const query = state.repoQuery.trim().toLowerCase();
  const shortName = repoName;
  const all = { repo: null, label: t('allProjects', { n: state.repoTotal }), count: null };
  const matching = state.repos
    .filter(entry => !query || shortName(entry.repo).toLowerCase().includes(query))
    .map(entry => ({ repo: entry.repo, label: shortName(entry.repo), count: entry.count }));

  return query ? matching : [all, ...matching];
}

function renderRepoTrigger() {
  const label = state.repo
    ? `${repoName(state.repo)} (${state.repos.find(e => e.repo === state.repo)?.count ?? 0})`
    : t('allProjects', { n: state.repoTotal });

  const trigger = el('repoTrigger');
  trigger.innerHTML = `<span>${state.repo ? repoDot(state.repo) : ''}${escapeHtml(label)}</span><span class="caret">▾</span>`;
  trigger.classList.toggle('on', Boolean(state.repo));
  trigger.setAttribute('aria-expanded', String(state.repoOpen));
}

// Rebuilt on its own so typing never blows away the search field's focus.
function renderRepoList() {
  const options = repoOptions();
  state.repoActive = Math.min(state.repoActive, Math.max(0, options.length - 1));

  el('repoList').innerHTML = options.length
    ? options
        .map((option, index) => {
          const selected = (option.repo ?? null) === state.repo;
          return `<button type="button" class="picker-option${index === state.repoActive ? ' active' : ''}"`
            + ` role="option" aria-selected="${selected}" data-repo="${escapeHtml(option.repo ?? '')}">`
            + `<span class="label">${option.repo ? repoDot(option.repo) : ''}${escapeHtml(option.label)}</span>`
            + `${option.count === null ? '' : `<span class="n">${option.count}</span>`}</button>`;
        })
        .join('')
    : `<div class="picker-empty">${t('noProject')}</div>`;
}

// The repos to colour: those on the board, and those already coloured, which may have left it.
function settingsRepos() {
  return [...new Set([...state.repos.map(entry => entry.repo), ...Object.keys(repoColors.read())])]
    .sort((a, b) => repoName(a).localeCompare(repoName(b)));
}

function colorRowHtml(repo) {
  const tint = repoColors.get(repo);
  const chip = repoTint(repo);
  const swatches = PRRadarColors.PRESETS.map(preset => `<button type="button" class="swatch${tint?.preset === preset.id ? ' on' : ''}"`
    + ` style="--repo-h:${preset.h};--repo-c:${preset.c}" data-color-preset="${preset.id}" data-color-repo="${escapeHtml(repo)}"`
    + ` title="${escapeHtml(t(`color_${preset.id}`))}" aria-label="${escapeHtml(t(`color_${preset.id}`))}"></button>`).join('');
  const near = tint && PRRadarColors.nearState(tint);
  return `<div class="color-row" data-row-repo="${escapeHtml(repo)}"><div class="top">`
    + `<span class="repo${chip.cls}"${chip.style} title="${escapeHtml(repo)}">${escapeHtml(repoName(repo))}</span>`
    + `<span class="swatches">${swatches}`
    + `<label class="swatch-other" title="${escapeHtml(t('colorOther'))}"><input type="color" value="${escapeHtml(tint?.hex ?? '#0d7490')}"`
    + ` data-color-pick="${escapeHtml(repo)}" aria-label="${escapeHtml(t('colorOther'))}">${escapeHtml(t('colorOther'))}</label>`
    + `</span>`
    + `${tint ? `<button type="button" class="color-reset" data-color-reset="${escapeHtml(repo)}">${escapeHtml(t('colorDefault'))}</button>` : '<span></span>'}`
    + `</div>`
    + `${near ? `<div class="color-warn">${escapeHtml(t('colorNearState', { state: t(`state_${near}`) }))}</div>` : ''}</div>`;
}

function renderSettings() {
  const repos = settingsRepos();
  el('settingsPanel').innerHTML = `<h2 id="settingsHead">${escapeHtml(t('settingsRepoColors'))}</h2>`
    + `<p class="hint">${escapeHtml(t('settingsRepoColorsHint'))}</p>`
    + (repos.length ? `<div class="color-list">${repos.map(colorRowHtml).join('')}</div>` : `<p class="hint">${escapeHtml(t('settingsNoRepo'))}</p>`);
}

function openSettings(open) {
  state.settingsOpen = open;
  el('settingsPanel').hidden = !open;
  el('settings').classList.toggle('on', open);
  el('settings').setAttribute('aria-expanded', String(open));
  if (open) renderSettings();
}

// A colour changed: the board and the panel's own row redraw; the rest of the panel stays,
// so a native colour picker being dragged is not closed under the mouse.
function applyRepoColor(repo, tint, { redrawRow = true } = {}) {
  repoColors.set(repo, tint);
  render();
  const row = document.querySelector(`.color-row[data-row-repo="${CSS.escape(repo)}"]`);
  if (!row) return;
  if (redrawRow) {
    row.outerHTML = colorRowHtml(repo);
    return;
  }
  const chip = row.querySelector('.repo');
  const live = repoTint(repo);
  chip.className = `repo${live.cls}`;
  chip.setAttribute('style', live.style.replace(/^ style="|"$/g, ''));
}

function openRepoPicker(open) {
  state.repoOpen = open;
  state.repoQuery = '';
  state.repoActive = 0;
  el('repoPanel').hidden = !open;
  el('repoSearch').value = '';
  el('repoSearch').placeholder = t('searchProject');
  el('repoTrigger').setAttribute('aria-expanded', String(open));
  if (!open) return;
  renderRepoList();
  el('repoSearch').focus();
}

function pickRepo(repo) {
  state.repo = repo || null;
  openRepoPicker(false);
  render();
}

// They report and they filter. The control they used to duplicate — the "needs work"
// checkbox — is gone, so this is now the only way to narrow the board by state.
const counter = (key, kind, value, label) => {
  const active = state.focus === key;
  const classes = ['counter', kind, value ? '' : 'zero', active ? 'on' : ''].filter(Boolean);
  // A counter at zero would only filter to nothing: better not to offer it.
  return `<button type="button" class="${classes.join(' ')}" data-focus="${key}"`
    + `${value ? '' : ' disabled'}`
    + `${value ? ` title="${t(active ? 'focusClear' : 'focusHint')}"` : ''}>`
    + `<span class="dot"></span><b>${value}</b> ${label}`
    + `<span class="go">${active ? '×' : '›'}</span></button>`;
};

function render() {
  const data = state.data;
  if (!data) return;

  el('scope').innerHTML = `${escapeHtml(data.org)} · `
    + `<a href="https://github.com/${encodeURIComponent(data.me)}" target="_blank"`
    + ` rel="noopener">@${escapeHtml(data.me)}</a>`;

  const mine = data.mine.map(resolveMine);
  const reviews = data.reviews.map(resolveReview);
  // Judged on the resolved list, so the rule and the button agree on what "asks for
  // action" means — the raw payload's needsAction ignores the "hide bots" filter.
  state.snoozed = snoozes.applicable([...mine, ...reviews]);
  cardNotes.prune([...mine, ...reviews]);
  state.seen = seen.sync([...mine, ...reviews]);

  const mineAction = filterList(mine).filter(pr => pr.needsAction).length;
  const reviewAction = filterList(reviews).filter(pr => pr.needsAction).length;
  const waitingFix = filterList(reviews).filter(pr => pr.bucket === 'waiting').length;
  const mineReady = filterList(mine).filter(pr => pr.bucket === 'ready').length;
  // An approval landing is news worth the chime and the glow, though it is not a fix: it
  // rings with the actions, and keeps a counter of its own.
  const total = mineAction + reviewAction + mineReady;
  const arrived = trackGlow([...filterList(mine), ...filterList(reviews)]
    .filter(pr => pr.needsAction || pr.bucket === 'ready').map(pr => pr.id));
  // A card that just landed is the news: a folded section would hide it behind the chime.
  expandGroups([
    ...mine.filter(pr => arrived.has(pr.id)).map(pr => `mine:${pr.bucket}`),
    ...reviews.filter(pr => arrived.has(pr.id)).map(pr => `reviews:${pr.bucket}`),
  ]);

  el('counters').innerHTML = [
    counter('mineAction', 'todo', mineAction, t('counterMine')),
    counter('mineReady', 'ready', mineReady, tn('counterReady', mineReady)),
    counter('reviewAction', 'todo', reviewAction, tn('counterReviews', reviewAction)),
    counter('reviewWaiting', 'pending', waitingFix, t('counterWaiting')),
  ].join('');

  // With no href the CSS hides the link: an empty URL removes it from the header.
  if (data.gitdeckUrl) el('gitdeck').href = data.gitdeckUrl;
  else el('gitdeck').removeAttribute('href');

  // Slack is kept out of "incomplete data": when it fails the board is still whole, only
  // the announcement links are missing, and the fix is on the reader's side.
  const warnings = data.warnings ?? [];
  const slackWarning = warnings.find(w => w.source === 'slack');
  const claudeWarning = warnings.find(w => w.source === 'claude');
  const sources = [...new Set(warnings.filter(w => w.source !== 'slack' && w.source !== 'claude').map(w => w.source))];
  const lines = [];
  if (sources.length) lines.push(tn('warning', sources.length, { sources: sources.join(', ') }));
  if (slackWarning) {
    lines.push(slackWarning.kind === 'no-connector'
      ? t('slackNoConnector')
      : t('slackFailed', { message: slackWarning.message.replace(/^slack:\s*/, '') }));
  }
  if (claudeWarning) lines.push(t('claudeScanFailed', { message: claudeWarning.message }));
  el('warning').hidden = lines.length === 0;
  el('warning').textContent = lines.join(' ');

  const asleep = state.snoozed.size;
  el('snoozedNote').innerHTML = asleep
    ? `<button type="button" class="counter asleep${state.revealSnoozed ? ' on' : ''}" data-reveal`
      + ` title="${t(state.revealSnoozed ? 'snoozedHide' : 'snoozedShow')}">`
      + `${PAUSE}<b>${asleep}</b> ${t('snoozedBadge')}`
      + `<span class="go">${state.revealSnoozed ? '×' : '›'}</span></button>`
      + (state.revealSnoozed
        ? `<button type="button" class="wake" data-wake>${t('snoozedWake')}</button>`
        : '')
    : '';

  const moved = [...mine, ...reviews].filter(pr => changesOf(pr).length).length;
  el('seenNote').innerHTML = moved
    ? `<button type="button" class="wake" data-seen-all>${escapeHtml(tn('seenAll', moved))}</button>`
    : '';

  const hidden = data.counts.hiddenStale;
  el('stale').textContent = hidden ? tn('stale', hidden, { days: data.maxAgeDays }) : '';

  document.title = total ? `(${total}) PR Radar` : 'PR Radar';
  applyStampTitle();
  renderStamp();

  // Only the projects actually on the board, so the list never offers an empty result.
  const all = [...data.mine, ...data.reviews];
  const perRepo = new Map();
  for (const pr of all) perRepo.set(pr.repo, (perRepo.get(pr.repo) ?? 0) + 1);
  if (state.repo && !perRepo.has(state.repo)) state.repo = null;

  const repos = [...perRepo.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  state.repos = repos.map(([repo, count]) => ({ repo, count }));
  state.repoTotal = all.length;
  renderRepoTrigger();
  if (state.repoOpen) renderRepoList();

  const focus = FOCUS[state.focus];
  document.querySelector('main').dataset.focus = focus ? focus.column : '';

  const shownMine = renderColumn(el('mine'), mine, mineCard, {
    action: t('groupMineAction'),
    ready: t('groupMineReady'),
    merged: t('groupMineMerged'),
    waiting: t('groupMineWaiting'),
    // On my side "idle" can only be a draft now: approved ones are ready to merge.
    idle: t('groupMineDrafts'),
  }, t('emptyMine'), focus?.column === 'mine' ? focus.bucket : null);

  // The notes summarise what is on screen, so the project picker and the filters double
  // as their scope.
  state.visibleMine = shownMine.map(pr => pr.id);
  el('notes').hidden = !data.digestAvailable;

  const shownReviews = renderColumn(el('reviews'), reviews, reviewCard, {
    action: t('groupReviewAction'),
    merged: t('groupMineMerged'),
    waiting: t('groupReviewWaiting'),
    idle: t('groupIdle'),
  }, t('emptyReviews'), focus?.column === 'reviews' ? focus.bucket : null);

  state.visibleReviews = shownReviews.map(pr => pr.id);
  renderOrbits([...shownMine, ...shownReviews]);

  if (state.lastActionCount !== null && total > state.lastActionCount) beep();
  state.lastActionCount = total;

  // `autofocus` on a freshly injected textarea is not reliable enough across browsers to
  // depend on alone for landing the cursor at the end rather than the start.
  if (state.editingNote) {
    const textarea = document.querySelector('.note-editor textarea');
    if (textarea) {
      textarea.focus();
      textarea.selectionStart = textarea.selectionEnd = textarea.value.length;
    }
  }
}

function renderSkeleton() {
  el('mine').innerHTML = '<div class="card skeleton"></div>'.repeat(3);
  el('reviews').innerHTML = '<div class="card skeleton"></div>'.repeat(2);
  // Only the board had one: loading straight into the orbit view (it is remembered
  // across visits) left it a plain, unbroken fill with nothing saying data was coming.
  const cell = '<figure class="orbit"><div class="orbit-skel"></div>'
    + '<div class="orbit-skel-caption"></div></figure>';
  el('orbits').innerHTML = `<div class="orbit-grid">${cell.repeat(3)}</div>`;
}

const UPDATE_TITLES_SHOWN = 8;

// Shown only when this clone is behind origin/main, and only until dismissed for that
// exact remote commit: the next push brings it back. Nothing here pulls or reloads —
// updating means a terminal and a restart, so the banner says so and gets out of the way.
function renderUpdate(update) {
  const box = el('update');
  const dismissed = store.get('updateDismissed', null);
  if (!update?.behind || dismissed === update.latest) {
    box.hidden = true;
    return;
  }
  const titles = update.titles.slice(0, UPDATE_TITLES_SHOWN).map(title => `<li>${escapeHtml(title)}</li>`);
  const more = update.titles.length - UPDATE_TITLES_SHOWN;
  box.innerHTML = `<b>${t('updateTitle')}</b>`
    + `<span>${tn('updateBehind', update.behind)}</span>`
    + `<span>${t('updateHow', { command: '<code>git pull</code>' })}</span>`
    + `<button type="button" class="notes-act" data-update-copy>${t('updateCopy')}</button>`
    + `<button type="button" class="notes-act dismiss" data-update-dismiss="${escapeHtml(update.latest)}"`
    + ` title="${escapeHtml(t('updateDismiss'))}" aria-label="${escapeHtml(t('updateDismiss'))}">×</button>`
    + `<ul class="update-titles">${titles.join('')}${more > 0 ? `<li>${t('updateMore', { n: more })}</li>` : ''}</ul>`;
  box.hidden = false;
}

// What a render depends on, minus the check time: the page polls the server every few
// seconds, and redrawing an unchanged board would close an open note editor for nothing.
const boardSignature = payload => JSON.stringify([payload.mine, payload.reviews, payload.warnings, payload.update, payload.counts]);

async function load(force, { check = false } = {}) {
  // Only an asked-for refresh spins the button: the background polls would make it twitch.
  if (force) el('refresh').classList.add('busy');
  try {
    const params = new URLSearchParams();
    if (force) params.set('force', '1');
    if (check) params.set('check', '1');
    if (document.hidden) params.set('hidden', '1');
    const response = await fetch(`/api/prs${params.size ? `?${params}` : ''}`);
    const version = response.headers.get('x-pr-radar-version');
    if (version) {
      bootVersion ??= version;
      if (version !== bootVersion) el('reload').hidden = false;
    }

    const payload = await response.json();
    if (!response.ok) throw new Error(payload.error || response.statusText);
    el('error').hidden = true;
    const unchanged = state.data && boardSignature(state.data) === boardSignature(payload);
    state.data = payload;
    scheduleRefresh(payload.pageRefreshSeconds ?? payload.refreshSeconds);
    if (unchanged) {
      renderStamp();
      return;
    }
    cardNotes.seed(payload.demoNotes);
    repoColors.seed(payload.demoRepoColors);
    seen.seed(payload.demoSeen, payload.demoStartedAt);
    renderUpdate(payload.update);
    el('summary').hidden = false;
    render();
  } catch (error) {
    el('error').hidden = false;
    el('error').textContent = t('error', { message: error.message });
    // A first load that fails must not leave a sweeping skeleton pretending to work.
    if (!state.data) {
      el('mine').innerHTML = '';
      el('reviews').innerHTML = '';
    }
  } finally {
    el('refresh').classList.remove('busy');
  }
}

// By PR rather than on the button: a refresh landing mid-request redraws the button
// without its busy state, and a second click would open a second terminal.
const resuming = new Set();

async function resumeClaudeSession(button) {
  const id = button.dataset.claude;
  if (resuming.has(id)) return;
  resuming.add(id);
  button.classList.add('busy');
  try {
    const response = await fetch('/api/claude-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id }),
    });
    if (!response.ok) {
      const payload = await response.json().catch(() => ({}));
      throw new Error(payload.error || `${response.status} ${response.statusText}`);
    }
  } catch (error) {
    alert(t('claudeError', { message: error.message }));
  } finally {
    resuming.delete(id);
    document.querySelector(`.claude-link[data-claude="${id}"]`)?.classList.remove('busy');
  }
}

const prById = id => [...(state.data?.mine ?? []), ...(state.data?.reviews ?? [])].find(pr => pr.id === id);

// Opening a PR from the board, left or middle click, is having seen what moved on it. The
// link still opens; only the photo is retaken.
function seenByOpening(event) {
  const link = event.target.closest('.card a.title, a.sat[data-peek]');
  if (!link || (event.type === 'auxclick' && event.button !== 1)) return;
  const pr = prById(link.dataset.peek ?? link.closest('.card')?.dataset.id);
  if (!pr || !changesOf(pr).length) return;
  seen.mark([pr]);
  setTimeout(render, 0);
}
document.addEventListener('click', seenByOpening, true);
document.addEventListener('auxclick', seenByOpening, true);

// Seen it: a hover or a click on a glowing card puts its rail back to normal.
document.addEventListener('mouseover', event => stopGlow(event.target.closest('.card.glow')));

document.addEventListener('click', event => {
  stopGlow(event.target.closest('.card.glow'));
  const dismissUpdate = event.target.closest('[data-update-dismiss]');
  if (dismissUpdate) {
    store.set('updateDismissed', dismissUpdate.dataset.updateDismiss);
    el('update').hidden = true;
    return;
  }

  const copyUpdate = event.target.closest('[data-update-copy]');
  if (copyUpdate) {
    navigator.clipboard.writeText('git pull').then(() => {
      copyUpdate.textContent = t('updateCopied');
      copyUpdate.classList.add('done');
      setTimeout(() => {
        copyUpdate.textContent = t('updateCopy');
        copyUpdate.classList.remove('done');
      }, 1500);
    });
    return;
  }

  const groupLabel = event.target.closest('.group-label[data-group]');
  if (groupLabel) {
    toggleGroup(groupLabel);
    return;
  }

  const noteButton = event.target.closest('.note-btn');
  if (noteButton) {
    // Any open editor already saved itself on the focusout this click just caused, so
    // reading cardNotes here (inside render, via cardHtml) is never a step behind.
    const { note } = noteButton.dataset;
    state.editingNote = state.editingNote === note ? null : note;
    render();
    return;
  }

  // A click anywhere outside the open editor closes it — the text is already safe (the
  // focusout this same click caused fired first), this only collapses it back to display.
  if (state.editingNote && !event.target.closest('.note-editor')) {
    state.editingNote = null;
    render();
    return;
  }

  const claudeButton = event.target.closest('.claude-link');
  if (claudeButton) {
    resumeClaudeSession(claudeButton);
    return;
  }

  const snoozeButton = event.target.closest('.snooze');
  if (snoozeButton) {
    const { snooze } = snoozeButton.dataset;
    const pr = [...state.data.mine, ...state.data.reviews].find(entry => entry.id === snooze);
    if (state.snoozed.has(snooze)) {
      const map = snoozes.read();
      delete map[snooze];
      snoozes.write(map);
    } else if (pr) {
      snoozes.add(pr);
    }
    render();
    return;
  }

  if (event.target.closest('[data-reveal]')) {
    state.revealSnoozed = !state.revealSnoozed;
    render();
    return;
  }

  const sinceToggle = event.target.closest('[data-since]');
  if (sinceToggle) {
    const { since } = sinceToggle.dataset;
    if (state.sinceOpen.has(since)) state.sinceOpen.delete(since);
    else state.sinceOpen.add(since);
    render();
    return;
  }
  if (event.target.closest('[data-seen-all]')) {
    seen.mark([...state.data.mine, ...state.data.reviews]);
    render();
    return;
  }

  if (event.target.closest('[data-wake]')) {
    snoozes.clear();
    state.revealSnoozed = false;
    render();
    return;
  }

  const option = event.target.closest('.picker-option');
  if (option) {
    pickRepo(option.dataset.repo);
    return;
  }
  // composedPath is captured at dispatch time, so it still holds nodes that a re-render
  // has since detached — `closest` on the target alone would miss them.
  const insidePicker = event.composedPath().some(node => node.id === 'picker');
  if (state.repoOpen && !insidePicker) openRepoPicker(false);

  const path = event.composedPath();
  if (path.some(node => node.id === 'settings')) {
    openSettings(!state.settingsOpen);
    return;
  }
  const preset = event.target.closest('[data-color-preset]');
  if (preset) {
    const chosen = PRRadarColors.PRESETS.find(entry => entry.id === preset.dataset.colorPreset);
    applyRepoColor(preset.dataset.colorRepo, { h: chosen.h, c: chosen.c, preset: chosen.id });
    return;
  }
  const reset = event.target.closest('[data-color-reset]');
  if (reset) {
    applyRepoColor(reset.dataset.colorReset, null);
    return;
  }
  if (state.settingsOpen && !path.some(node => node.id === 'settingsPanel')) openSettings(false);

  const focusButton = event.target.closest('.counter[data-focus]');
  if (focusButton) {
    const { focus } = focusButton.dataset;
    state.focus = state.focus === focus ? null : focus;
    if (state.focus) expandGroups([`${FOCUS[focus].column}:${FOCUS[focus].bucket}`]);
    render();
    return;
  }

  const expander = event.target.closest('.expander');
  if (!expander) return;
  const { id } = expander.closest('.card').dataset;
  if (state.open.has(id)) state.open.delete(id);
  else state.open.add(id);
  render();
});

// Saved on blur, not on every keystroke: a textarea mid-edit is not yet a decision, and
// `focusout` (unlike `blur`) bubbles, so one delegated listener covers every card.
document.addEventListener('focusout', event => {
  const textarea = event.target.closest('.note-editor textarea');
  if (!textarea) return;
  const { id } = textarea.closest('.card').dataset;
  cardNotes.set(id, textarea.value.trim());
});

document.addEventListener('keydown', event => {
  if (event.key !== 'Escape') return;
  if (state.editingNote) {
    // Escape does not blur the textarea on its own, so the focusout autosave never runs —
    // saved explicitly here instead, from whichever value is on screen right now.
    const textarea = document.querySelector('.note-editor textarea');
    if (textarea) cardNotes.set(state.editingNote, textarea.value.trim());
    state.editingNote = null;
    render();
    return;
  }
  if (state.repoOpen) {
    openRepoPicker(false);
    el('repoTrigger').focus();
    return;
  }
  if (state.settingsOpen) {
    openSettings(false);
    el('settings').focus();
    return;
  }
  if (!state.focus) return;
  state.focus = null;
  render();
});

// Dragging in the native picker fires `input` continuously: the chips follow live, and the
// row's warning is settled on `change`, once the colour is let go.
document.addEventListener('input', event => {
  const pick = event.target.closest?.('[data-color-pick]');
  if (pick) applyRepoColor(pick.dataset.colorPick, PRRadarColors.toTint(pick.value), { redrawRow: false });
});
document.addEventListener('change', event => {
  const pick = event.target.closest?.('[data-color-pick]');
  if (pick) applyRepoColor(pick.dataset.colorPick, PRRadarColors.toTint(pick.value));
});

// A laptop waking from sleep leaves setInterval far behind: without this you read
// forty-minute-old data believing it is fresh. The server cache absorbs the extra call.
let hiddenSince = null;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') {
    hiddenSince = Date.now();
    return;
  }
  const away = hiddenSince ? Date.now() - hiddenSince : 0;
  hiddenSince = null;
  // A glow that started while the tab was hidden would be over before anyone looked.
  let started = false;
  for (const [id, until] of state.glow) {
    if (until === null) {
      state.glow.set(id, Date.now() + GLOW_MS);
      started = true;
    }
  }
  if (started) {
    scheduleGlowExpiry();
    render();
  }
  // Back after a while, likely from GitHub itself: ask for a check now, not at the next tick.
  load(false, { check: away > 60_000 });
});

el('repoTrigger').addEventListener('click', () => openRepoPicker(!state.repoOpen));

el('repoSearch').addEventListener('input', event => {
  state.repoQuery = event.target.value;
  state.repoActive = 0;
  renderRepoList();
});

el('repoSearch').addEventListener('keydown', event => {
  const options = repoOptions();
  if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
    event.preventDefault();
    const step = event.key === 'ArrowDown' ? 1 : -1;
    state.repoActive = (state.repoActive + step + options.length) % Math.max(1, options.length);
    renderRepoList();
    return;
  }
  if (event.key === 'Enter' && options[state.repoActive]) {
    event.preventDefault();
    pickRepo(options[state.repoActive].repo);
  }
});

el('reload').addEventListener('click', () => location.reload());

const NOTES_ICON = '<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor"'
  + ' stroke-width="1.5" stroke-linecap="round" aria-hidden="true">'
  + '<path d="M3 4h10"/><path d="M3 8h10"/><path d="M3 12h6"/></svg>';

const COPY_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"'
  + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<rect x="5.6" y="5.6" width="8" height="8" rx="1.8"/>'
  + '<path d="M10.4 3.4A1.4 1.4 0 0 0 9 2H3.9A1.9 1.9 0 0 0 2 3.9V9a1.4 1.4 0 0 0 1.4 1.4"/></svg>';

const CHECK_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9"'
  + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<path d="M3 8.4l3.1 3.1L13 4.6"/></svg>';

// A daily reports the previous working day, so Monday looks back to Friday rather than
// to an empty Sunday.
function lastWorkingDay() {
  const since = new Date();
  since.setHours(0, 0, 0, 0);
  do {
    since.setDate(since.getDate() - 1);
  } while (since.getDay() === 0 || since.getDay() === 6);
  return since;
}

function scopeLabel() {
  return notesWindow === 'all'
    ? t('scopeAll')
    : t('scopeDay', {
        date: lastWorkingDay().toLocaleDateString(LOCALE[lang], {
          weekday: 'short',
          day: 'numeric',
          month: 'short',
        }),
      });
}

function applyScopeLabel() {
  el('notesScope').textContent = scopeLabel();
  el('notesScope').title = t('scopeTitle');
}

// An icon needs its meaning somewhere: the label the button used to carry becomes its
// tooltip and its accessible name.
function restoreCopy() {
  const button = el('notesCopy');
  button.innerHTML = COPY_ICON;
  button.title = t('notesCopy');
  button.setAttribute('aria-label', t('notesCopy'));
  button.classList.remove('done');
}

// The bucket already means something everywhere else on the board; a satellite wears the
// same colour as the card it stands for.
const ORBIT_COLOURS = {
  action: ['var(--indigo)', 'var(--indigo-soft)'],
  ready: ['var(--indigo)', 'var(--emerald-soft)'],
  waiting: ['var(--amber)', 'var(--amber-soft)'],
  merged: ['var(--emerald)', 'var(--emerald-soft)'],
  idle: ['var(--text-faint)', 'var(--surface)'],
};

const HUB_R = 30;
const SAT_R = 18;
// Arc length each satellite needs, which is what sets the ring's radius: crowding eight
// of them onto a fixed circle would have them overlap.
const SAT_ARC = 52;

function orbitCell(login, avatarUrl, prs) {
  const ringR = Math.max(HUB_R + SAT_R + 14, Math.ceil((prs.length * SAT_ARC) / (2 * Math.PI)));
  const size = (ringR + SAT_R + 12) * 2;
  const c = size / 2;
  const clip = `hub-${login.replace(/[^A-Za-z0-9]/g, '')}`;

  const satellites = prs
    .map((pr, index) => {
      const angle = -Math.PI / 2 + (index * 2 * Math.PI) / prs.length;
      const [stroke, fill] = ORBIT_COLOURS[pr.bucket] ?? ORBIT_COLOURS.idle;
      const x = c + ringR * Math.cos(angle);
      const y = c + ringR * Math.sin(angle);
      const from = [c + HUB_R * Math.cos(angle), c + HUB_R * Math.sin(angle)];
      const to = [c + (ringR - SAT_R) * Math.cos(angle), c + (ringR - SAT_R) * Math.sin(angle)];

      return `<line class="spoke" x1="${from[0].toFixed(1)}" y1="${from[1].toFixed(1)}"`
        + ` x2="${to[0].toFixed(1)}" y2="${to[1].toFixed(1)}" stroke="${stroke}" opacity=".45"/>`
        + `<a class="sat" href="${escapeHtml(pr.url)}" target="_blank" rel="noreferrer"`
        + ` data-peek="${escapeHtml(pr.id)}">`
        + `<title>${escapeHtml(`${repoName(pr.repo)} #${pr.number} — ${pr.title}`)}</title>`
        + `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${SAT_R}" fill="${fill}" stroke="${stroke}"/>`
        + `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" fill="${stroke}">${pr.number}</text></a>`;
    })
    .join('');

  const hub = avatarUrl
    ? `<clipPath id="${clip}"><circle cx="${c}" cy="${c}" r="${HUB_R}"/></clipPath>`
      + `<image href="${escapeHtml(avatarUrl)}&s=120" x="${c - HUB_R}" y="${c - HUB_R}"`
      + ` width="${HUB_R * 2}" height="${HUB_R * 2}" clip-path="url(#${clip})"`
      + ` preserveAspectRatio="xMidYMid slice"/>`
    : `<circle cx="${c}" cy="${c}" r="${HUB_R}" fill="var(--sunken)"/>`;

  return `<figure class="orbit"><div class="orbit-peek"></div>`
    + `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img"`
    + ` aria-label="${escapeHtml(login)}">`
    + satellites
    // The same target as the faces on a card and the handle in the header: an avatar in
    // this tool leads to its profile.
    + `<a class="hub" href="https://github.com/${encodeURIComponent(login)}"`
    + ` target="_blank" rel="noopener">`
    + `<title>${escapeHtml(t('openProfile', { login }))}</title>`
    + hub
    + `<circle class="hub-ring" cx="${c}" cy="${c}" r="${HUB_R}"/>`
    + `</a></svg>`
    + `<figcaption>${escapeHtml(login)} <em>${tn('orbitPrs', prs.length)}</em></figcaption>`
    + `</figure>`;
}

// Grouped by author, me first: on the review side that is how the work actually comes —
// three PRs from one person are one conversation.
function renderOrbits(prs) {
  if (!prs.length) {
    el('orbits').innerHTML = `<div class="empty">${t('emptyMine')}</div>`;
    return;
  }

  const byAuthor = new Map();
  for (const pr of prs) {
    if (!byAuthor.has(pr.author)) byAuthor.set(pr.author, []);
    byAuthor.get(pr.author).push(pr);
  }

  const me = state.data?.me;
  const authors = [...byAuthor.entries()].sort(
    ([a, left], [b, right]) =>
      Number(b === me) - Number(a === me) || right.length - left.length || a.localeCompare(b),
  );

  const legend = ['action', 'ready', 'waiting', 'merged', 'idle']
    .map(
      bucket =>
        `<span><i style="background:${bucket === 'ready' ? 'linear-gradient(135deg, var(--indigo), var(--emerald))' : ORBIT_COLOURS[bucket][0]}"></i>${t(`orbit_${bucket}`)}</span>`,
    )
    .join('');

  const avatarOf = (login, list) =>
    list.flatMap(pr => pr.contributors ?? []).find(person => person.login === login)?.avatarUrl;

  el('orbits').innerHTML = `<div class="orbit-legend">${legend}</div>`
    + `<div class="orbit-grid">`
    + authors.map(([login, list]) => orbitCell(login, avatarOf(login, list), list)).join('')
    + `</div>`;
}

function peekHtml(pr) {
  const pills = [
    pr.isDraft ? pill('draft', t('pillDraft')) : '',
    ...(pr.side === 'mine' ? minePills(pr) : reviewPills(pr)),
    ciPill(pr),
  ].filter(Boolean);

  return `<div class="peek-top">`
    + repoChip(pr)
    + `</div>`
    + `<div class="peek-title">${escapeHtml(pr.title)}</div>`
    + `<div class="meta">${pills.join('')}`
    + `<span class="sep" title="${t('agoTitle')}">${t('activeAgo', { v: ago(pr.lastActivityAt) })}</span>`
    + `</div>`;
}

// Placed against the satellite and kept inside its cell: a bubble on the right edge would
// otherwise open a card that runs off the column.
document.addEventListener('mouseover', event => {
  const sat = event.target.closest('.sat[data-peek]');
  if (!sat) return;
  const cell = sat.closest('.orbit');
  const peek = cell.querySelector('.orbit-peek');
  const pr = [...(state.data?.mine ?? []), ...(state.data?.reviews ?? [])]
    .find(entry => entry.id === sat.dataset.peek);
  if (!pr) return;

  peek.innerHTML = peekHtml(pr.side === 'mine' ? resolveMine(pr) : resolveReview(pr));
  const bubble = sat.getBoundingClientRect();
  const box = cell.getBoundingClientRect();
  const left = bubble.left - box.left + bubble.width / 2 - peek.offsetWidth / 2;
  peek.style.left = `${Math.max(-40, Math.min(left, box.width + 40 - peek.offsetWidth))}px`;

  // Above the bubble when it sits in the lower half: below, the card would cover the
  // hub's own caption and the satellites either side of it.
  const below = bubble.bottom - box.top + 8;
  const above = bubble.top - box.top - peek.offsetHeight - 8;
  const lower = bubble.top + bubble.height / 2 > box.top + box.height / 2;
  peek.style.top = `${lower && above > -30 ? above : below}px`;
  peek.classList.add('on');
});

document.addEventListener('mouseout', event => {
  const sat = event.target.closest('.sat[data-peek]');
  if (sat) sat.closest('.orbit').querySelector('.orbit-peek').classList.remove('on');
});

// The model emits fixed `## MINE` / `## REVIEWS` markers; the headings shown and copied
// are built here, so they follow the interface language.
function splitSections(text) {
  const sections = [];
  for (const line of text.split('\n').map(l => l.trim()).filter(Boolean)) {
    const marker = line.match(/^[#*\s]*(MINE|REVIEWS)[*\s:]*$/i);
    if (marker) {
      sections.push({ group: marker[1].toUpperCase(), lines: [] });
      continue;
    }
    if (!sections.length) sections.push({ group: null, lines: [] });
    sections[sections.length - 1].lines.push(line);
  }
  return sections.filter(section => section.lines.length);
}

// On screen the PR number becomes a link to the PR it summarises; the clipboard gets
// plain markdown, which is what pastes into a standup note.
// The weekday on every line, today's included. Dropping it for today read as an
// oversight next to the others, and left the column ragged — the same length everywhere
// is what makes it a column.
function activityClock(iso) {
  const at = new Date(iso);
  return `${at.toLocaleDateString(LOCALE[lang], { weekday: 'short' })} `
    + at.toLocaleTimeString(LOCALE[lang], { hour: '2-digit', minute: '2-digit' });
}

// The state comes off the board, never from the model: the bucket is already computed,
// and asking prose to carry it would put it a regeneration away and let it go stale.
const NOTE_STATE = {
  action: ['todo', 'orbit_action'],
  ready: ['ready', 'orbit_ready'],
  waiting: ['pending', 'orbit_waiting'],
  merged: ['good', 'orbit_merged'],
  idle: ['', 'orbit_idle'],
};

function showNotes(text, counts) {
  applyScopeLabel();
  // Looked up in the bullet's own section first: two repos can share a number, and the
  // same number in "mine" and "reviews" is two different PRs.
  const byNumber = list => new Map((list ?? []).map(pr => [String(pr.number), pr]));
  const sides = { MINE: byNumber(state.data?.mine), REVIEWS: byNumber(state.data?.reviews) };
  const anywhere = new Map([...sides.REVIEWS, ...sides.MINE]);
  const find = (group, number) => sides[group]?.get(number) ?? anywhere.get(number);
  const heading = group =>
    group === 'REVIEWS'
      ? t('notesReviews', { n: counts?.reviews ?? 0 })
      : t('notesMine', { n: counts?.mine ?? 0 });

  const sections = splitSections(text);
  const copied = [];

  el('notesBody').innerHTML = sections
    .map(section => {
      const items = section.lines.map(line => {
        // The model does not always put a space before the sentence: "#812 Fixes…" in
        // English, but "#812: Corrige…" in French — observed 2026-09-29, where the colon
        // sat right against the digits and the old `\s+`-only regex fell through to the
        // plain-line fallback, losing the time, repo and state pill on every line.
        // One number or several — a bullet can cover a whole piece of work, "#9977 #8522"
        // or "#9977, #8522:". The model does not always put a space before the sentence
        // either: "#812: Corrige…" in French, observed 2026-09-29. Nor always the dash:
        // on 2026-10-01 the French notes came back as bare "#9977 #8522 …" lines, and every
        // one fell to the plain fallback. "#" then a digit cannot be a "## MINE" marker.
        const bullet = line.match(/^(?:[-*•]\s*)?(#\d+(?:[\s,]+#\d+)*)\s*(?::\s*|\s)\s*(\S.*)$/);
        const numbers = bullet ? bullet[1].match(/\d+/g) : [];
        const rest = bullet ? bullet[2] : '';
        const plain = bullet ? `${numbers.map(n => `#${n}`).join(' ')} ${rest}` : line.replace(/^[-*•]\s*/, '');
        const drop = `<button type="button" class="drop" title="${t('dropLine')}"`
          + ` aria-label="${t('dropLine')}">×</button>`;

        if (!bullet) {
          copied.push(`- ${plain}`);
          return `<li data-copy="${escapeHtml(plain)}"><span>${escapeHtml(plain)}</span>${drop}</li>`;
        }
        const entries = numbers.map(number => {
          const pr = find(section.group, number);
          const label = pr ? `${repoName(pr.repo)} #${number}` : `#${number}`;
          return { number, pr, label, state: NOTE_STATE[pr?.bucket] ?? [] };
        });
        const known = entries.filter(entry => entry.pr);
        const latest = known.map(entry => entry.pr.lastActivityAt).sort().pop();
        // One pill when every part stands in the same place, one per part otherwise:
        // "back merged, front awaiting review" is the news of a piece of work.
        const keys = [...new Set(entries.map(entry => entry.state[1]).filter(Boolean))];
        const pills = keys.length <= 1
          ? (keys.length ? [pill(entries.find(e => e.state[1])?.state[0], t(keys[0]))] : [])
          : entries.filter(entry => entry.state[1]).map(entry => pill(entry.state[0], t(entry.state[1])));
        // The word travels with the copy: "merged" is half of what a standup line says.
        const marked = `${entries.map(entry => entry.label).join(' + ')}`
          + `${keys.length ? ` (${(keys.length === 1 ? keys : entries.map(e => e.state[1]).filter(Boolean)).map(k => t(k)).join(', ')})` : ''}`
          + ` ${rest}`;
        copied.push(`- ${marked}`);

        const links = entries.map(entry => (entry.pr
          ? `<a class="num${repoTint(entry.pr.repo).cls}"${repoTint(entry.pr.repo).style} href="${escapeHtml(entry.pr.url)}" target="_blank" rel="noopener"`
            + ` title="${escapeHtml(entry.pr.repo)}">${escapeHtml(entry.label)}</a>`
          : `<span class="num">${escapeHtml(entry.label)}</span>`)).join('');

        return `<li data-copy="${escapeHtml(marked)}">`
          + (latest
            ? `<span class="when" title="${escapeHtml(t('agoTitle'))}">${activityClock(latest)}</span>`
            : '')
          + (entries.length > 1 ? `<span class="nums" title="${escapeHtml(t('notesSameWork'))}">${links}</span>` : links)
          + `<span class="state">${pills.join('')}</span>`
          + `<span>${escapeHtml(rest)}</span>${drop}</li>`;
      });

      if (!section.group) return items.join('');
      copied.splice(copied.length - items.length, 0, `**${heading(section.group)}**`);
      return `<li class="notes-group" data-heading="${escapeHtml(heading(section.group))}">`
        + `${escapeHtml(heading(section.group))}</li>` + items.join('');
    })
    .join('');

  state.notesText = copied.join('\n');
  el('notesTitle').textContent = t('notes');
  restoreCopy();
  el('notesPanel').hidden = false;
  el('notesPanel').classList.remove('stale');
  // Same open-state look as the project filter: the control says whether its panel is up.
  el('notes').classList.add('on');
  el('notes').setAttribute('aria-expanded', 'true');
}

function closeNotes() {
  el('notesPanel').hidden = true;
  el('notes').classList.remove('on');
  el('notes').setAttribute('aria-expanded', 'false');
}

// The model call takes half a minute on a full board, so the wait is carried by the
// button that started it rather than by a blocking overlay: the board stays readable.
// The window narrows what is sent, not what the board shows: the board answers "what
// needs me now", and hiding a card that asks something of you would break that.
// Oldest activity first: a standup is told in the order the day happened, not in the
// board's order of urgency. Sorted before the request rather than after the answer, since
// the model words the bullets against the order it is given.
function forNotes(ids) {
  const activity = new Map(
    [...(state.data?.mine ?? []), ...(state.data?.reviews ?? [])].map(pr => [
      pr.id,
      new Date(pr.lastActivityAt).getTime(),
    ]),
  );
  const since = notesWindow === 'all' ? 0 : lastWorkingDay().getTime();

  return ids
    .filter(id => (activity.get(id) ?? 0) >= since)
    .sort((a, b) => (activity.get(a) ?? 0) - (activity.get(b) ?? 0));
}

// A model call runs for a minute and a half; the server kills its own after three. The
// client had no limit at all, so a response that never arrived would strand the button.
const NOTES_TIMEOUT_MS = 200_000;

// The other language is written straight after, in the background. Switching then costs
// a cache read instead of another minute — and nothing on screen waits for it, so the
// first answer is not slowed down to pay for a language you may never ask for.
function writeOtherLanguage(mine, reviews) {
  fetch('/api/digest', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ mine, reviews, lang: lang === 'fr' ? 'en' : 'fr' }),
  }).catch(() => {});
}

async function writeNotes() {
  const mine = forNotes(state.visibleMine);
  const reviews = forNotes(state.visibleReviews);
  if (!mine.length && !reviews.length) return showNotes(t('notesEmpty'), null);

  const button = el('notes');
  button.classList.add('busy');
  button.disabled = true;
  el('notesLabel').textContent = t('notesBusy');

  // What is on screen belongs to the previous answer until the new one lands, and a
  // rewrite runs for a minute: left at full strength it reads as the current notes.
  if (!el('notesPanel').hidden) el('notesPanel').classList.add('stale');

  const abort = new AbortController();
  const timer = setTimeout(() => abort.abort(), NOTES_TIMEOUT_MS);

  try {
    const response = await fetch('/api/digest', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mine, reviews, lang }),
      signal: abort.signal,
    });
    const payload = await response.json();
    if (!response.ok) throw new Error(payload.error || response.statusText);
    showNotes(payload.text || t('notesEmpty'), payload.counts);
    if (payload.text) writeOtherLanguage(mine, reviews);
  } catch (error) {
    showNotes(t('notesError', { message: error.message }), null);
  } finally {
    clearTimeout(timer);
    button.classList.remove('busy');
    button.disabled = false;
    el('notesLabel').textContent = t('notes');
  }
}

// The button that opened the panel closes it. Rewriting the notes on a second click
// would charge a fresh generation for what reads as a dismissal.
el('notes').addEventListener('click', () => {
  if (el('notesPanel').hidden) return writeNotes();
  closeNotes();
});

el('notesScope').addEventListener('click', () => {
  notesWindow = notesWindow === 'all' ? 'day' : 'all';
  store.set('notesWindow', notesWindow);
  applyScopeLabel();
  writeNotes();
});

// Dropping a line rebuilds the clipboard from what is left, headings included, so a
// section emptied by hand stops being announced.
el('notesBody').addEventListener('click', event => {
  const drop = event.target.closest('.drop');
  if (!drop) return;
  drop.closest('li').remove();

  const lines = [];
  for (const item of el('notesBody').children) {
    if (item.classList.contains('notes-group')) {
      const next = item.nextElementSibling;
      if (next && !next.classList.contains('notes-group')) lines.push(`**${item.dataset.heading}**`);
      continue;
    }
    lines.push(`- ${item.dataset.copy}`);
  }
  for (const heading of [...el('notesBody').querySelectorAll('.notes-group')]) {
    const next = heading.nextElementSibling;
    if (!next || next.classList.contains('notes-group')) heading.remove();
  }
  state.notesText = lines.join('\n');
});
el('notesClose').addEventListener('click', closeNotes);

el('notesCopy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(state.notesText ?? '');
    el('notesCopy').innerHTML = CHECK_ICON;
    el('notesCopy').title = t('notesCopied');
    el('notesCopy').classList.add('done');
    setTimeout(restoreCopy, 1600);
  } catch {
    restoreCopy();
  }
});
el('refresh').addEventListener('click', () => load(true));
applyLang(lang);
renderSkeleton();
load(false);
</script>
</body>
</html>
