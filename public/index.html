<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Radar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236d63e6'/%3E%3Cstop offset='1' stop-color='%234a42b8'/%3E%3C/linearGradient%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%23fff' stop-opacity='0'/%3E%3Cstop offset='1' stop-color='%23fff' stop-opacity='.75'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7.5' fill='url(%23bg)'/%3E%3Cg transform='translate(16 16) scale(.8) translate(-16 -16)'%3E%3Cpath d='M16%2C16L16%2C3.2A12.8%2C12.8%2C0%2C0%2C1%2C27.09%2C9.6Z' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='16' r='13.6' fill='none' stroke='%23fff' stroke-width='2.6'/%3E%3Ccircle cx='16' cy='16' r='7.4' fill='none' stroke='%23fff' stroke-width='2' opacity='.5'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23fff' opacity='.8'/%3E%3Ccircle cx='21.2' cy='9' r='3.9' fill='%23fff'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f6fb;
    --linear: #5e6ad2;
    --bg-accent: radial-gradient(1200px 320px at 12% -10%, #e9e7fd 0%, transparent 70%),
                 radial-gradient(900px 280px at 88% -14%, #e2f2f7 0%, transparent 70%);
    --surface: #ffffff;
    --sunken: #f1f1f7;
    --border: #e5e4f0;
    --hairline: #eeedf6;
    --text: #1d1e28;
    --text-soft: #575a6b;
    --text-faint: #8e91a6;

    --indigo: #5a51d4;
    --indigo-2: #8b5cf6;
    --indigo-soft: #eeecfd;
    --amber: #a8710a;
    --amber-2: #d99a1e;
    --amber-soft: #fdf3e0;
    --emerald: #0f7f61;
    --emerald-2: #2fb389;
    --emerald-soft: #e4f5ef;
    --rose: #c04440;
    --rose-2: #e0716c;
    --rose-soft: #fdedec;
    --cyan: #0d7490;
    --cyan-2: #2aa5c0;
    --cyan-soft: #e2f2f7;

    --link: #4f46c8;
    --shadow-sm: 0 1px 2px rgba(29, 30, 40, .05);
    --shadow-md: 0 6px 18px -6px rgba(60, 50, 140, .18), 0 2px 4px rgba(29, 30, 40, .04);
  }

  :root[data-theme="dark"] {
    --bg: #101219;
    --linear: #ffffff;
    --bg-accent: radial-gradient(1200px 320px at 12% -10%, #1e1b3d 0%, transparent 70%),
                 radial-gradient(900px 280px at 88% -14%, #102d38 0%, transparent 70%);
    --surface: #191c26;
    --sunken: #15171f;
    --border: #292d3b;
    --hairline: #222634;
    --text: #e7e8f0;
    --text-soft: #a4a8bd;
    --text-faint: #757a92;

    --indigo: #a29bf5;
    --indigo-2: #c4b5fd;
    --indigo-soft: #241f4d;
    --amber: #e0b264;
    --amber-2: #f0cd91;
    --amber-soft: #33270e;
    --emerald: #5fcda6;
    --emerald-2: #8ee0c2;
    --emerald-soft: #102b23;
    --rose: #e79a95;
    --rose-2: #f0b8b4;
    --rose-soft: #341d1d;
    --cyan: #63c6dd;
    --cyan-2: #93dbeb;
    --cyan-soft: #102b34;

    --link: #a5a0f5;
    --shadow-sm: none;
    --shadow-md: 0 8px 22px -10px rgba(0, 0, 0, .6);
  }

  * { box-sizing: border-box; }
  /* Controls set their own `display`, which would otherwise beat the UA rule and show
     an empty button before the first payload. */
  [hidden] { display: none !important; }

  body {
    margin: 0;
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 16px 28px;
    background-color: var(--bg);
    background-image: var(--bg-accent);
    border-bottom: 1px solid var(--border);
    backdrop-filter: saturate(1.2);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 15.5px; font-weight: 680; letter-spacing: -.2px; }
  .brand em { font-style: normal; font-weight: 450; color: var(--text-faint); font-size: 13px; letter-spacing: 0; }
  .brand em a:hover { color: var(--indigo); text-decoration: underline; }
  .logo { width: 26px; height: 26px; flex: none; color: var(--indigo); }
  .logo .sweep { fill: url(#sweepGrad); opacity: .8; transform-origin: 16px 16px; }
  .logo .blip { fill: var(--indigo); }
  @media (prefers-reduced-motion: no-preference) {
    .logo .sweep { animation: spin 4.5s linear infinite; }
    .logo .blip { animation: pulse 2.2s ease-in-out infinite; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { opacity: 1; r: 3.4px; } 50% { opacity: .6; r: 2.8px; } }

  /* The counters left the header: this is a summary of the content, not a control of
     the tool. Sitting above the columns they summarise, they may carry a container
     again — now that they filter, the box no longer lies. */
  /* Hidden until the first payload: the project picker rendered as an empty box, and
     an empty control is worse than no control. */
  .summary {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
    padding: 20px 28px 0;
  }
  .counters { display: flex; gap: 8px; flex-wrap: wrap; }
  /* The three summary counters report; the snooze pill beside them acts. Same shape, so
     the lift and the pointer hang off the element being a button rather than off the
     class — otherwise a number invites a click that does nothing. */
  .counter {
    display: flex; align-items: center; gap: 8px;
    font: inherit; font-size: 12px; color: var(--text-soft); text-align: left;
    padding: 6px 11px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm);
    transition: background .15s, border-color .15s, box-shadow .18s, transform .18s;
  }
  button.counter { cursor: pointer; }
  button.counter:hover {
    border-color: color-mix(in srgb, var(--indigo) 40%, transparent);
    box-shadow: var(--shadow-md); transform: translateY(-1px);
  }
  .counter.on {
    background: var(--indigo-soft);
    border-color: color-mix(in srgb, var(--indigo) 45%, transparent);
  }
  button.counter:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }
  .counter.pending.on {
    background: var(--amber-soft);
    border-color: color-mix(in srgb, var(--amber) 50%, transparent);
  }
  button.counter.pending:hover { border-color: color-mix(in srgb, var(--amber) 45%, transparent); }
  .counter[disabled] { cursor: default; background: transparent; box-shadow: none; transform: none; }
  .counter[disabled] .go { display: none; }
  .counter.zero { background: transparent; box-shadow: none; }
  .counter b {
    font-size: 16px; font-weight: 680; letter-spacing: -.4px; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .counter .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .counter.todo b { color: var(--indigo); }
  .counter.todo .dot { background: linear-gradient(135deg, var(--indigo), var(--indigo-2)); }
  .counter.ready b { color: var(--indigo); }
  .counter.ready .dot { background: linear-gradient(135deg, var(--indigo), var(--emerald)); }
  .counter.pending b { color: var(--amber); }
  .counter.pending .dot { background: linear-gradient(135deg, var(--amber), var(--amber-2)); }
  .counter.zero { color: var(--text-faint); border-color: var(--hairline); }
  .counter.zero b { color: var(--text-faint); font-weight: 550; }
  .counter.zero .dot { background: var(--border); }
  .counter .go { font-size: 11px; opacity: .3; transition: opacity .15s, transform .15s; }
  button.counter:hover .go { opacity: .8; transform: translateX(2px); }
  .counter.on .go { opacity: .8; }

  .spacer { flex: 1 1 auto; }
  .controls { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--text-soft); }
  .controls > * { height: 31px; }
  /* The filters are not controls of the tool: they keep the wider spacing so the seam
     between the two families stays readable at the tighter toolbar gap. */
  /* A speaker rather than a checkbox: the toolbar is glyphs now, and a muted chime is a
     state of the tool, not a filter on the board. */
  #sound { width: 32px; padding: 0; justify-content: center; }
  #sound .wave { transition: opacity .15s; }
  #sound .muted { opacity: 0; transition: opacity .15s; }
  #sound.off .wave { opacity: 0; }
  #sound.off .muted { opacity: 1; }
  #sound svg { width: 15px; height: 15px; display: block; }
  #sound:not(.off) {
    color: #fff; background: linear-gradient(135deg, var(--indigo), var(--indigo-2));
    border-color: transparent;
  }
  #reload { color: var(--amber); background: var(--amber-soft); border-color: transparent; }
  #reload:hover { color: var(--amber); border-color: var(--amber); }
  #stamp { display: inline-flex; align-items: center; font-size: 12px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  #stamp:empty { display: none; }
  #stamp:not(:empty) { margin-left: 4px; }
  #stamp.aged { color: var(--amber); font-weight: 600; }
  #stamp.aged::after { content: " ⚠"; margin-left: 3px; }
  .stale { font-size: 12.5px; color: var(--text-faint); margin-left: auto; }
  /* Interactive, so it gets a container — same rule as the toolbar controls. Its
     options live outside `.controls`, so they do not inherit that boxed look. */
  .picker { position: relative; }
  .picker-trigger {
    display: flex; align-items: center; gap: 8px;
    font: inherit; font-size: 12px; color: var(--text-soft); cursor: pointer;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 6px 11px; box-shadow: var(--shadow-sm);
    transition: border-color .15s, background .15s;
  }
  .picker-trigger:hover { border-color: color-mix(in srgb, var(--indigo) 40%, transparent); }
  .picker-trigger.on {
    background: var(--indigo-soft); color: var(--indigo); font-weight: 600;
    border-color: color-mix(in srgb, var(--indigo) 45%, transparent);
  }
  .picker-trigger:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }
  .picker-trigger .caret { font-size: 9px; opacity: .5; }

  .picker-panel {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 20;
    width: 270px; padding: 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow-md);
  }
  .picker-panel input {
    width: 100%; font: inherit; font-size: 12.5px; color: var(--text);
    background: var(--sunken); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 9px; margin-bottom: 6px;
  }
  .picker-panel input:focus { outline: none; border-color: var(--indigo); }
  .picker-list { max-height: 270px; overflow-y: auto; display: flex; flex-direction: column; }
  .picker-option {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font: inherit; font-size: 12.5px; text-align: left; color: var(--text-soft);
    background: none; border: 0; border-radius: 7px; padding: 6px 8px; cursor: pointer;
  }
  .picker-option:hover, .picker-option.active { background: var(--hairline); color: var(--text); }
  .picker-option[aria-selected="true"] { color: var(--indigo); font-weight: 620; }
  .picker-option .n { flex: none; font-size: 11.5px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .picker-option .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .picker-empty { font-size: 12px; color: var(--text-faint); padding: 10px; text-align: center; }

  /* The boxed-control look is reserved for the toolbar. The page's other <button>s —
     counters, expanders — are not controls of the tool and used to inherit that box by
     accident. */
  .controls button {
    display: inline-flex; align-items: center; gap: 6px;
    font: inherit; font-size: 12.5px; font-weight: 520; cursor: pointer; color: var(--text-soft);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 9px; padding: 0 12px; box-shadow: var(--shadow-sm);
    transition: color .15s, border-color .15s, transform .15s;
  }
  .controls button:hover { color: var(--indigo); border-color: var(--indigo); transform: translateY(-1px); }
  #theme { width: 32px; padding: 0; justify-content: center; font-size: 13px; }
  #settings { width: 32px; padding: 0; justify-content: center; }
  #settings svg { width: 15px; height: 15px; }
  #settings.on { color: var(--indigo); border-color: var(--indigo); }

  /* A repo's own colour: its hue and intensity are the user's, the lightness the theme's,
     so whatever was picked stays readable on both. */
  :root { --repo-bg-l: 94%; --repo-fg-l: 44%; --swatch-l: 68%; }
  :root[data-theme="dark"] { --repo-bg-l: 27%; --repo-fg-l: 84%; --swatch-l: 72%; }
  .repo.tinted {
    background: oklch(var(--repo-bg-l) calc(var(--repo-c) * .45) var(--repo-h));
    color: oklch(var(--repo-fg-l) var(--repo-c) var(--repo-h));
  }
  .repo-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: oklch(var(--swatch-l) var(--repo-c) var(--repo-h)); margin-right: 6px; vertical-align: 0;
  }

  .settings-panel {
    position: absolute; top: calc(100% - 4px); right: 28px; z-index: 30;
    width: max-content; min-width: min(460px, calc(100vw - 32px)); max-width: calc(100vw - 32px); max-height: min(70vh, 620px); overflow: auto;
    padding: 14px 16px 16px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow-md);
  }
  .settings-panel h2 { margin: 0 0 2px; font-size: 13.5px; font-weight: 650; }
  /* The hint wraps to the rows' width instead of widening the panel. */
  .settings-panel .hint { margin: 0 0 12px; font-size: 12px; color: var(--text-faint); contain: inline-size; }
  /* One grid shared by all rows (subgrid): the name column is as wide as the longest name, so
     the swatches line up and a "default" appearing moves nothing. A name only gets an
     ellipsis when the screen is too narrow for it. */
  .color-list { display: grid; grid-template-columns: minmax(0, max-content) auto auto; column-gap: 12px; }
  .color-row {
    grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; row-gap: 6px;
    padding: 9px 0; border-top: 1px solid var(--hairline);
  }
  .color-row:first-child { border-top: 0; }
  .color-row .top { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: center; }
  .color-row .repo { min-width: 0; max-width: max-content; overflow: hidden; text-overflow: ellipsis; }
  .color-warn { grid-column: 1 / -1; }
  .color-row .color-reset { justify-self: start; }
  .swatches { display: flex; align-items: center; gap: 6px; }
  .swatch {
    width: 18px; height: 18px; border-radius: 50%; padding: 0; cursor: pointer;
    border: 2px solid transparent; background: oklch(var(--swatch-l) var(--repo-c) var(--repo-h));
    box-shadow: 0 0 0 1px var(--border);
  }
  .swatch.on { border-color: var(--surface); box-shadow: 0 0 0 2px var(--text); }
  .swatch:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }
  .swatch-other {
    position: relative; display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
    font-size: 11.5px; color: var(--text-soft);
  }
  .swatch-other input { width: 22px; height: 20px; padding: 0; border: 0; background: none; cursor: pointer; }
  .color-reset {
    font: inherit; font-size: 11.5px; color: var(--text-faint); background: none; border: 0;
    padding: 0 2px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
  }
  .color-reset:hover { color: var(--text); }
  .color-warn { font-size: 11.5px; color: var(--amber); }
  /* The mirror of PR Radar's own button on gitdeck: each tool points at the other with a
     soft-tinted pill in the host's accent, so the pair reads as one family. */
  a.link-out {
    display: none; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 600; color: var(--indigo);
    background: var(--indigo-soft);
    border: 1px solid color-mix(in srgb, var(--indigo) 28%, transparent);
    border-radius: 9px; padding: 0 12px; box-shadow: var(--shadow-sm);
    transition: color .15s, border-color .15s, transform .15s;
  }
  a.link-out[href] { display: inline-flex; }
  a.link-out:hover { border-color: var(--indigo); transform: translateY(-1px); }
  a.link-out svg { width: 14px; height: 14px; flex: none; }
  @media (prefers-reduced-motion: no-preference) {
    a.link-out:hover .branch-tip { animation: blip 1.6s ease-in-out infinite; }
  }
  @keyframes blip { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  .controls button.seg { display: flex; align-items: stretch; gap: 3px; padding: 3px; }
  .seg span {
    display: flex; align-items: center;
    padding: 3px 9px; border-radius: 6px; font-size: 11.5px; font-weight: 620;
    letter-spacing: .3px; color: var(--text-faint); transition: color .15s, background .15s;
  }
  .seg span.on { background: linear-gradient(135deg, var(--indigo), var(--indigo-2)); color: #fff; }
  #view span { display: flex; align-items: center; padding: 3px 8px; }
  #view svg { width: 13px; height: 13px; display: block; fill: currentColor; }

  /* One hub per author, its PRs on a ring around it. A fixed radial layout, not a physics
     simulation: the same board must land in the same shape every time, or there is no
     learning where anything is. */
  #orbits { padding: 26px 28px 70px; }
  .orbit-legend {
    display: flex; flex-wrap: wrap; gap: 8px 18px; margin-bottom: 22px;
    font-size: 11.5px; color: var(--text-faint);
  }
  .orbit-legend span { display: flex; align-items: center; gap: 7px; }
  .orbit-legend i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .orbit-grid {
    display: grid; gap: 8px 20px;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    align-items: start;
  }
  .orbit { margin: 0; position: relative; display: flex; flex-direction: column; align-items: center; }
  /* Scaled by its track rather than measured in JS: the drawing is in viewBox units, so
     the numbers and the rings grow together with no second source of truth for size. */
  .orbit svg { display: block; width: 100%; height: auto; max-width: 520px; }
  .orbit figcaption { margin-top: -4px; font-size: 13px; font-weight: 600; color: var(--text); }
  .orbit figcaption em { font-style: normal; font-weight: 450; color: var(--text-faint); }
  .hub { cursor: pointer; }
  .hub-ring { fill: none; stroke: var(--border); stroke-width: 2; transition: stroke .15s; }
  .hub:hover .hub-ring { stroke: var(--indigo); stroke-width: 3; }
  .hub:focus-visible { outline: 2px solid var(--indigo); outline-offset: 3px; border-radius: 50%; }
  .spoke { stroke-dasharray: 3 4; stroke-width: 1.4; }
  .sat circle { stroke-width: 1.5; transition: transform .15s; }
  .sat text {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px;
    font-weight: 650; text-anchor: middle; dominant-baseline: central; pointer-events: none;
  }
  .sat { cursor: pointer; }
  .sat:hover circle { stroke-width: 3; }
  .sat:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; border-radius: 50%; }

  /* A bubble says which state, never which PR. Hovering turns it into the line the board
     would have shown, positioned where the bubble sits. */
  .orbit-peek {
    position: absolute; z-index: 5; width: 300px; padding: 10px 12px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 11px; box-shadow: var(--shadow-md);
    pointer-events: none; opacity: 0; transition: opacity .12s;
  }
  .orbit-peek.on { opacity: 1; }
  .orbit-peek .peek-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 7px; }
  .orbit-peek .peek-title {
    font-size: 13px; font-weight: 620; line-height: 1.35; color: var(--text);
  }
  .orbit-peek .meta { margin-top: 0; }
  .seg:hover { border-color: var(--indigo); }
  #refresh { color: #fff; font-weight: 620; background: linear-gradient(135deg, var(--indigo), var(--indigo-2)); border-color: transparent; }
  #refresh:hover { color: #fff; border-color: transparent; filter: brightness(1.07); }

  /* The notes write something; everything to the separator's right narrows what is
     already there. A flex item rather than a pseudo-element on the button: the band's own
     gap then centres it, with no offset to keep in step with that gap. */
  .band-sep {
    flex: none; width: 1px; height: 22px; align-self: center;
    background: color-mix(in srgb, var(--text-faint) 42%, transparent);
  }
  #notes[hidden] + .band-sep { display: none; }

  /* Everything in this band is a white pill carrying a small coloured mark — the counters'
     dots. So the accent that sets the one productive control apart goes in its icon, not
     in its container, and the open state stays free to tint the whole pill. */
  .notes-btn .ic { width: 13px; height: 13px; flex: none; color: var(--indigo); }
  .notes-btn.on .ic { color: currentColor; }
  /* A minute of waiting cannot rest on three 13px lines fading: the button is inert
     meanwhile, and a white one among white controls still looks clickable. Same sweep as
     the loading skeletons, which already means "content is on its way" here. */
  .notes-btn.busy {
    color: var(--indigo);
    border-color: color-mix(in srgb, var(--indigo) 35%, transparent);
    background:
      linear-gradient(90deg, transparent, color-mix(in srgb, var(--indigo) 13%, transparent), transparent)
      0 0 / 40% 100% no-repeat var(--indigo-soft);
    cursor: default;
  }
  /* Not the Refresh spin: rotating three horizontal lines turns them into diagonals and
     means nothing. They light up in sequence instead, like text being written — on the
     sweep's own tempo, so the two read as one rhythm rather than beating against it. */
  @media (prefers-reduced-motion: no-preference) {
    .notes-btn.busy { animation: sweep 1.3s ease-in-out infinite; }
    .notes-btn.busy .ic path { animation: writing 1.3s ease-in-out infinite; }
    .notes-btn.busy .ic path:nth-child(2) { animation-delay: .18s; }
    .notes-btn.busy .ic path:nth-child(3) { animation-delay: .36s; }
  }
  @keyframes writing { 0%, 100% { opacity: .2; } 45% { opacity: 1; } }
  .notes-panel {
    margin: 14px 28px 0; padding: 13px 16px 15px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow-sm);
  }
  .notes-head {
    display: flex; align-items: center; gap: 8px;
    font-size: 11.5px; font-weight: 650; letter-spacing: .4px; text-transform: uppercase;
    color: var(--text-faint); margin-bottom: 10px;
  }
  /* Four fixed cells, so the times read down the edge and every sentence starts on the
     same line. Widths sized for the longest value each can hold: "mer. 10:03",
     "forestadmin-server #8516" (ellipsised past that — a rare, very long repo name should
     not stretch every other line to fit it), and the longest state word, measured
     generously. */
  #notesBody .when {
    flex: none; width: 66px; text-align: right;
    font-size: 11.5px; color: var(--text-faint); font-variant-numeric: tabular-nums;
    padding-top: 1px;
  }
  #notesBody .num {
    flex: none; width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* A bullet can cover a whole piece of work: its PRs stack in the same cell, each its own
     link, so the column keeps its width and every sentence still starts on one edge. */
  #notesBody .nums { flex: none; width: 190px; display: flex; flex-direction: column; gap: 2px; position: relative; }
  /* A bracket in the gutter ties the stacked PRs together, without pushing them off the
     edge the single-PR lines' numbers sit on. Cyan: it is still about where the work is. */
  #notesBody .nums::before {
    content: ""; position: absolute; left: -9px; top: 4px; bottom: 4px; width: 5px;
    border: 2px solid var(--cyan); border-right: 0; border-radius: 2px 0 0 2px; opacity: .45;
  }
  #notesBody .nums .num { width: auto; }
  #notesBody .state { flex: none; width: 112px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
  /* Aligned to the first line: a bullet is a sentence carrying a marker, not a pill with
     a sentence stuck to it. */
  #notesBody .pill { flex: none; align-self: flex-start; margin-top: 1px; }
  /* Refresh's own fill: it carries the window being summarised, which is the one thing
     about these notes worth reading before the notes themselves. Not cyan — that means a
     location here (the repo badge, a thread's path, the PR numbers below). */
  .notes-scope {
    height: 24px; padding: 0 10px;
    font: inherit; font-size: 11px; font-weight: 620; letter-spacing: .2px;
    text-transform: none; color: #fff;
    background: linear-gradient(135deg, var(--indigo), var(--indigo-2));
    border: 1px solid transparent; border-radius: 7px; cursor: pointer;
    transition: filter .15s;
  }
  .notes-scope:hover { filter: brightness(1.07); }

  .notes-act {
    display: flex; align-items: center; justify-content: center;
    margin-left: auto; width: 24px; height: 24px; padding: 0;
    font: inherit; font-size: 14px; line-height: 1; color: var(--text-soft);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 7px; cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .notes-act:hover { color: var(--indigo); border-color: var(--indigo); }
  .notes-act svg { width: 13px; height: 13px; display: block; }
  #notesClose { margin-left: 0; }
  .notes-act.done { color: var(--emerald); border-color: color-mix(in srgb, var(--emerald) 45%, transparent); }

  .notes-panel.stale #notesBody { opacity: .35; }
  #notesBody { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; transition: opacity .2s; }
  #notesBody li { display: flex; gap: 14px; font-size: 12.5px; line-height: 1.55; color: var(--text); }
  /* No filter knows what you will actually mention: the last cut is made by hand. */
  #notesBody .drop {
    flex: none; margin-left: auto; width: 18px; height: 18px; padding: 0;
    font: inherit; font-size: 13px; line-height: 1; color: var(--text-faint);
    background: none; border: 0; border-radius: 5px; cursor: pointer;
    opacity: 0; transition: opacity .15s, color .15s, background .15s;
  }
  #notesBody li:hover .drop, .drop:focus-visible { opacity: 1; }
  #notesBody .drop:hover { color: var(--rose); background: var(--rose-soft); }
  #notesBody .notes-group {
    display: block; margin: 6px 0 1px; font-size: 11px; font-weight: 650;
    letter-spacing: .4px; text-transform: uppercase; color: var(--text-faint);
  }
  #notesBody .notes-group:first-child { margin-top: 0; }
  #notesBody .num {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px;
    color: var(--cyan); padding-top: 1px;
  }
  #notesBody .num:hover { text-decoration: underline; }
  #notesBody .num.tinted { color: oklch(var(--repo-fg-l) var(--repo-c) var(--repo-h)); }

  /* An active counter isolates its column: full width, the other collapsed. */
  main[data-focus="mine"], main[data-focus="reviews"] { grid-template-columns: minmax(0, 1fr); }
  main[data-focus="mine"] .col-review, main[data-focus="reviews"] .col-mine { display: none; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; padding: 22px 28px 70px; align-items: start; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; gap: 26px; } }

  .col-mine { --col: var(--indigo); --col-2: var(--indigo-2); }
  .col-review { --col: var(--cyan); --col-2: var(--cyan-2); }

  .column-title {
    display: flex; align-items: center; gap: 9px;
    font-size: 13.5px; font-weight: 680; letter-spacing: -.1px; margin: 0 0 6px;
    padding-bottom: 11px; border-bottom: 1px solid var(--border); position: relative;
  }
  .column-title::after {
    content: ""; position: absolute; left: 0; bottom: -1px; width: 46px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, var(--col), var(--col-2));
  }
  .column-title .bar { width: 4px; height: 15px; border-radius: 3px; background: linear-gradient(180deg, var(--col), var(--col-2)); }

  .group-label {
    display: flex; align-items: center; gap: 8px; width: 100%;
    font: inherit; font-size: 11px; font-weight: 620; letter-spacing: .5px; text-transform: uppercase;
    color: var(--text-faint); margin: 24px 0 10px;
    background: none; border: 0; padding: 0; text-align: left; cursor: pointer;
  }
  .group-label .gchev {
    width: 6px; height: 6px; margin-left: 2px; flex: none; opacity: .6;
    border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
    transform: translateY(-2px) rotate(45deg); transition: transform .15s;
  }
  .group-label.collapsed .gchev { transform: rotate(-45deg); }
  .group-label.collapsed + .group-cards { display: none; }
  .group-label:first-of-type { margin-top: 18px; }
  .group-label .gdot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .group-label.action .gdot { background: linear-gradient(135deg, var(--indigo), var(--indigo-2)); }
  .group-label.ready .gdot { background: linear-gradient(135deg, var(--indigo), var(--emerald)); }
  .group-label.ready { color: var(--indigo); }
  .group-label.waiting .gdot,
  .group-label.merged .gdot { background: linear-gradient(135deg, var(--amber), var(--amber-2)); }
  .group-label.idle .gdot { background: var(--border); }
  .group-label.action { color: var(--indigo); }
  .group-label.waiting, .group-label.merged { color: var(--amber); }
  .group-label.merged.settled { color: var(--emerald); }
  .group-label.merged.settled .gdot { background: linear-gradient(135deg, var(--emerald), var(--emerald-2)); }
  .group-label.merged.settled .gcount { background: var(--emerald-soft); color: var(--emerald); }
  .group-label .gcount {
    font-size: 10.5px; letter-spacing: 0; padding: 1px 6px; border-radius: 20px;
    background: var(--hairline); color: var(--text-faint);
  }
  .group-label.action .gcount { background: var(--indigo-soft); color: var(--indigo); }
  .group-label.waiting .gcount,
  .group-label.merged .gcount { background: var(--amber-soft); color: var(--amber); }

  .card {
    position: relative; overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 13px;
    box-shadow: var(--shadow-sm);
    padding: 14px 16px 14px 18px;
    margin-bottom: 10px;
    transition: box-shadow .18s, transform .18s;
  }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .card.action::before { background: linear-gradient(180deg, var(--indigo), var(--indigo-2)); }
  /* Ready to merge: indigo for "your move", green for "because it is approved" — no new
     hue, a recipe of two that already mean exactly those things. */
  .card.ready::before { background: linear-gradient(180deg, var(--indigo), var(--emerald)); }
  .card.ready { background: linear-gradient(100deg, var(--indigo-soft) -10%, var(--emerald-soft) 14%, var(--surface) 42%); }
  .card.waiting::before,
  .card.merged::before { background: linear-gradient(180deg, var(--amber), var(--amber-2)); }
  .card.action { background: linear-gradient(100deg, var(--indigo-soft) -10%, var(--surface) 42%); }
  .card.waiting,
  .card.merged { background: linear-gradient(100deg, var(--amber-soft) -10%, var(--surface) 42%); }

  /* The release outcome paints the whole card, not just a pill: after a merge it is the
     only thing left to know. Amber while it runs — the outcome is not known yet, and
     green would announce a success that has not happened. */
  .card.pipeline-done,
  .card.pipeline-none { background: linear-gradient(100deg, var(--emerald-soft) -10%, var(--surface) 45%); }
  .card.pipeline-done::before,
  .card.pipeline-none::before { background: linear-gradient(180deg, var(--emerald), var(--emerald-2)); }
  .card.pipeline-failed { background: linear-gradient(100deg, var(--rose-soft) -10%, var(--surface) 45%); }
  .card.pipeline-failed::before { background: linear-gradient(180deg, var(--rose), var(--rose-2)); }

  /* A gradient's stops cannot be animated, so the breathing lives on an overlay whose
     opacity can. Content is lifted above it. */
  .card.pipeline-running::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background: linear-gradient(100deg, var(--amber-soft) -10%, transparent 55%);
  }
  .card > * { position: relative; z-index: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .card.pipeline-running::after { animation: breathe 1.8s ease-in-out infinite; }
  }

  /* A card that just rang keeps its rail lit, so a glance says which one it was. Only "to
     act" cards ever glow, and their rail is indigo already: the halo adds no new colour. */
  /* The card clips what sits left of it, so the light goes inwards: the rail widens and
     throws a soft glow onto the card itself. */
  .card.glow::before { width: 5px; z-index: 2; }
  @keyframes rail-glow {
    0%, 100% { width: 4px; box-shadow: 2px 0 8px 0 color-mix(in srgb, var(--indigo) 20%, transparent); }
    50% { width: 7px; box-shadow: 6px 0 22px 2px color-mix(in srgb, var(--indigo) 45%, transparent); }
  }
  @keyframes rail-glow-out {
    from { width: 5px; box-shadow: 4px 0 14px 1px color-mix(in srgb, var(--indigo) 30%, transparent); }
    to { width: 3px; box-shadow: 0 0 0 0 transparent; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .card.glow::before { animation: rail-glow 2.4s ease-in-out infinite var(--glow-elapsed, 0s); }
    .card.glow.glow-ending::before { animation: rail-glow-out 10s ease-out forwards var(--glow-fade-elapsed, 0s); }
  }
  @media (prefers-reduced-motion: reduce) {
    .card.glow::before { width: 6px; filter: saturate(1.5) brightness(1.1); }
  }
  /* The plain card: it is the others that add something. Receding through a grey fill
     could not work — page, fill and border sit within 1.2:1 of each other in this palette
     — so it recedes through the one channel that carries priority here, colour: no rail,
     no tint, nothing but the surface every card starts from. */
  .card.idle { padding-left: 16px; }
  /* Green only once nothing is left to do. On a card that still asks something, it
     would overwrite the "your move" signal in the very channel that carries it — and
     an approved PR whose author has since replied is still your move. */
  .card.idle.approved {
    /* Same recipe as the action and waiting cards — fading to --sunken instead left the
       card green on the left and grey on the right. */
    background: linear-gradient(100deg, var(--emerald-soft) -10%, var(--surface) 45%);
    border-color: var(--border);
    box-shadow: var(--shadow-sm);
    padding-left: 18px;
  }
  .card.idle.approved::before { background: linear-gradient(180deg, var(--emerald), var(--emerald-2)); }
  /* Every card presents as one, so every card lifts. */
  .card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }

  .card-top { display: flex; gap: 9px; align-items: baseline; flex-wrap: wrap; }
  .age {
    flex: none; margin-left: auto; white-space: nowrap;
    font-size: 11.5px; color: var(--text-faint); font-variant-numeric: tabular-nums;
  }
  /* Cyan is already "where" in this palette — it is what a thread's file path wears.
     A repo name is a location too, and grey made it indistinguishable from the neutral
     state pills, which answer "what". 4.67:1 in light, 7.52 in dark. */
  .repo {
    font-size: 11.5px; font-weight: 550; padding: 2px 7px; border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", monospace;
    background: var(--cyan-soft); color: var(--cyan); white-space: nowrap;
  }
  .title { font-weight: 620; font-size: 14.5px; letter-spacing: -.15px; flex: 1 1 240px; }
  .title:hover { color: var(--link); }

  .meta { display: flex; flex-wrap: wrap; gap: 6px 9px; margin-top: 10px; font-size: 12px; color: var(--text-faint); align-items: center; }
  /* The separator is generated on the element it precedes, so it wraps with it and can
     never be left orphaned at the end of a line. */
  .meta .sep::before { content: "|"; color: var(--border); margin-right: 9px; }
  .who { display: flex; align-items: center; gap: 6px; }
  .stack { display: flex; flex: none; }
  .face {
    display: block; position: relative;
    width: 18px; height: 18px; border-radius: 50%; flex: none; overflow: hidden;
    background: var(--hairline); border: 1.5px solid var(--surface);
    transition: box-shadow .15s, transform .15s;
  }
  .face img { width: 100%; height: 100%; display: block; object-fit: cover; }
  /* Overlap: the faces read as a queue, the original author in front. */
  .stack .face + .face { margin-left: -6px; }
  /* Raised on hover so the growing face is not clipped under the next one. */
  .face:hover { box-shadow: 0 0 0 2px var(--indigo); transform: scale(1.12); z-index: 1; }
  .face:focus-visible { outline: 2px solid var(--indigo); outline-offset: 1px; z-index: 1; }
  .card.action .face { border-color: var(--surface); }

  .pill {
    padding: 2.5px 8px; border-radius: 7px; font-size: 11.5px; font-weight: 580;
    background: var(--hairline); color: var(--text-soft);
  }
  /* A pill reads as a label, so the few that open something (the failed run, the release)
     say so: the arrow a link to another tab usually wears, and a hover that answers. */
  /* No underline on hover: it broke at the gap before the arrow. The outline answers. */
  a.pill { text-decoration: none; cursor: pointer; transition: box-shadow .15s, filter .15s; }
  a.pill::after { content: "↗"; margin-left: 3px; font-size: .92em; opacity: .7; }
  a.pill:hover { box-shadow: inset 0 0 0 1px currentColor; filter: brightness(.97); }
  a.pill:hover::after { opacity: 1; }
  a.pill:focus-visible { outline: 2px solid currentColor; outline-offset: 1px; }
  /* A draft is provisional, and the neutral chip disappeared on an idle card: hairline on
     sunken is 1.03:1, and no grey in this palette clears 1.8:1 against another. A dashed
     outline reads on any ground — the pattern carries it, not the value — and says "not
     final" without borrowing a hue that already means something else. */
  .pill.draft {
    background: none; color: var(--text-soft);
    border: 1px dashed color-mix(in srgb, var(--text-faint) 60%, transparent);
    padding: 1.5px 7px;
  }
  .pill.todo { background: var(--indigo-soft); color: var(--indigo); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--indigo) 18%, transparent); }
  .pill.ready { background: linear-gradient(90deg, var(--indigo-soft), var(--emerald-soft)); color: var(--indigo); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--indigo) 18%, transparent); }
  .pill.pending { background: var(--amber-soft); color: var(--amber); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--amber) 18%, transparent); }
  .pill.good { background: var(--emerald-soft); color: var(--emerald); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--emerald) 18%, transparent); }
  .pill.alert { background: var(--rose-soft); color: var(--rose); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--rose) 18%, transparent); }
  /* A running pipeline breathes: the card is a live thing until the verdict lands. */
  @media (prefers-reduced-motion: no-preference) {
    .pill.running { animation: breathe 1.8s ease-in-out infinite; }
  }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

  /* One bar for the whole block, however many lines it holds: a bar per line broke at each gap. */
  .reasons {
    margin-top: 10px; display: flex; flex-direction: column; gap: 5px;
    position: relative; padding-left: 11px; color: var(--text-soft);
  }
  .reasons::before {
    content: ""; position: absolute; left: 0; top: 1px; bottom: 1px; width: 3px;
    border-radius: 2px; background: currentColor; opacity: .4;
  }
  /* What moved since you looked, as the reasons' last entry: same bar and colour, a lighter
     weight, so the reason above still reads first. */
  .reason.since { font-weight: 450; }
  .since-lead { opacity: .7; }
  .since-toggle {
    font: inherit; font-size: 12px; font-weight: 600; color: inherit; opacity: .75;
    background: none; border: 0; padding: 0 0 0 4px; cursor: pointer;
  }
  .since-toggle:hover { opacity: 1; }
  .since-toggle:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; border-radius: 3px; }
  /* A flex child of the reason row: without align-self it stretches to the row's height,
     its text stuck to the top. */
  .fresh-badge {
    align-self: center; display: inline-flex; align-items: center; height: 16px; padding: 0 5px;
    border-radius: 4px; font-size: 10px; line-height: 1; font-weight: 650; letter-spacing: .04em;
    text-transform: uppercase; background: var(--indigo-soft); color: var(--indigo);
  }
  /* A pill newly true since you looked, in its own colour: the line below says what it is. */
  .pill.fresh { position: relative; }
  .pill.fresh::before {
    content: ""; position: absolute; top: -3px; right: -3px; width: 7px; height: 7px;
    border-radius: 50%; background: currentColor; box-shadow: 0 0 0 2px var(--surface);
  }
  .since-list {
    list-style: none; margin: 0; padding: 7px 10px; display: grid; gap: 4px;
    background: var(--sunken); border-radius: 8px; font-size: 12px; color: var(--text-soft);
  }
  .since-list li { display: flex; gap: 12px; justify-content: space-between; }
  .since-at { color: var(--text-faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .reason { font-size: 12.5px; font-weight: 500; display: flex; gap: 8px; }
  .card.action .reasons { color: var(--indigo); }
  .card.waiting .reasons, .card.merged .reasons { color: var(--amber); }
  /* A merged card takes the colour of its release, as its rail does: amber only while it runs.
     Declared after the line above, which would otherwise win at equal specificity. */
  .card.pipeline-done .reasons, .card.pipeline-none .reasons { color: var(--emerald); }
  .card.pipeline-failed .reasons { color: var(--rose); }

  .expander {
    font: inherit; font-size: 12px; font-weight: 520; color: var(--text-faint);
    background: none; border: 0; padding: 0; cursor: pointer;
    margin-top: 11px; display: inline-block;
  }
  .expander:hover { color: var(--link); }
  .expander:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; border-radius: 4px; }

  /* Bottom row: threads on the left, snooze on the right. The row exists even with no
     thread to expand, so the anchor never moves. */
  .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

  /* Offered on every card. Visible on hover, and permanently once snoozed — otherwise
     nothing would say which card is asleep while they are revealed. */
  .snooze {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    flex: none; box-sizing: border-box; height: 26px; min-width: 26px; margin-top: 11px;
    font: inherit; font-size: 11.5px; line-height: 1.2; color: var(--text-faint);
    background: none; border: 0; padding: 0 7px; border-radius: 7px;
    cursor: pointer; opacity: 0; transition: opacity .15s, background .15s, color .15s;
  }
  .card:hover .snooze, .snooze:focus-visible { opacity: 1; }
  .snooze:hover { background: var(--hairline); color: var(--text-soft); }
  .snooze:focus-visible { outline: 2px solid var(--indigo); outline-offset: 1px; }
  .card.snoozed .snooze { opacity: 1; background: var(--hairline); color: var(--text-soft); }
  .card.snoozed { opacity: .55; }
  .card.snoozed:hover { opacity: 1; }

  .card-actions { display: flex; align-items: center; gap: 4px; flex: none; }
  /* Neutral, deliberately: this is an annotation, not a state — none of the five hues
     (indigo/amber/emerald/rose/cyan) mean "you wrote something here". */
  .note-btn {
    display: flex; align-items: center; justify-content: center;
    flex: none; width: 26px; height: 26px; margin-top: 11px; padding: 0;
    font: inherit; color: var(--text-faint);
    background: none; border: 0; border-radius: 7px;
    cursor: pointer; opacity: 0; transition: opacity .15s, background .15s, color .15s;
  }
  .note-btn svg { width: 13px; height: 13px; display: block; }
  .card:hover .note-btn, .note-btn:focus-visible, .note-btn.has-note,
  .card.editing-note .note-btn { opacity: 1; }
  .note-btn:hover { background: var(--hairline); color: var(--text-soft); }
  .note-btn:focus-visible { outline: 2px solid var(--indigo); outline-offset: 1px; }
  .note-btn.has-note { color: var(--text-soft); }

  .note-editor { margin-top: 9px; }
  .note-editor textarea {
    width: 100%; box-sizing: border-box; resize: vertical; min-height: 50px;
    font: inherit; font-size: 12.5px; line-height: 1.5; color: var(--text);
    background: var(--sunken); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px;
  }
  .note-editor textarea:focus { outline: none; border-color: var(--indigo); }
  .note-text {
    margin-top: 9px; padding: 8px 10px; font-size: 12.5px; line-height: 1.5;
    color: var(--text-soft); background: var(--sunken); border-radius: 8px;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .note-text a { color: var(--link); }

  /* Always visible, unlike the note and snooze buttons: it only exists on a card that has
     something to open. Last in the row, so the hover-only buttons appearing beside it
     never push it around. */
  .slack-link {
    display: flex; align-items: center; justify-content: center;
    flex: none; width: 26px; height: 26px; margin-top: 11px;
    border-radius: 7px; transition: background .15s;
  }
  .slack-link svg { width: 14px; height: 14px; display: block; }
  .slack-link:hover { background: var(--hairline); }
  .slack-link:focus-visible { outline: 2px solid var(--indigo); outline-offset: 1px; }
  /* Beside Slack, the other way out of the card: the brand mark, and the key, which mostly
     comes from the branch and is written nowhere else on the card. Left of Slack, so the
     hover-only buttons appearing never push either. */
  .linear-link {
    display: flex; align-items: center; gap: 5px;
    flex: none; height: 26px; margin-top: 11px; padding: 0 7px; box-sizing: border-box;
    border-radius: 7px; text-decoration: none; transition: background .15s;
    font: 550 11px/1 ui-monospace, SFMono-Regular, "SF Mono", monospace; color: var(--text-soft);
  }
  .linear-link svg { width: 13px; height: 13px; display: block; fill: var(--linear); }
  .linear-link:hover { background: var(--hairline); color: var(--text); }
  .linear-link:focus-visible { outline: 2px solid var(--indigo); outline-offset: 1px; }
  .claude-link {
    display: flex; align-items: center; justify-content: center;
    flex: none; width: 26px; height: 26px; margin-top: 11px; padding: 0;
    background: none; border: 0; border-radius: 7px; cursor: pointer; transition: background .15s, opacity .15s;
  }
  .claude-link svg { width: 14px; height: 14px; display: block; }
  .claude-link:hover { background: var(--hairline); }
  .claude-link:focus-visible { outline: 2px solid var(--indigo); outline-offset: 1px; }
  .claude-link.busy { opacity: .45; cursor: progress; }

  /* A set of PRs that one click reveals: the same species as the counters, so it takes
     the same tile rather than a third pattern. Neutral, because a snooze is not a
     priority. The secondary action only appears once the set is revealed. */
  /* An empty flex item still spends the band's gap on both of its sides. */
  .snoozed-note:empty { display: none; }
  .snoozed-note { display: flex; align-items: center; gap: 6px; }
  .counter.asleep { color: var(--text-faint); }
  .counter.asleep b { color: var(--text-soft); }
  .glyph { width: 8px; height: 10px; flex: none; opacity: .75; }
  .counter.asleep.on { background: var(--hairline); border-color: var(--border-strong, var(--border)); }
  /* Same family as the tiles — radius, padding — but transparent at rest, so it reads
     as subordinate to the one it belongs to rather than as bare floating text. */
  .wake {
    display: flex; align-items: center; gap: 6px;
    font: inherit; font-size: 12px; color: var(--text-faint); cursor: pointer;
    background: none; border: 1px solid transparent; border-radius: 10px;
    padding: 6px 10px;
    transition: color .15s, background .15s, border-color .15s;
  }
  .wake:hover {
    color: var(--indigo); background: var(--indigo-soft);
    border-color: color-mix(in srgb, var(--indigo) 30%, transparent);
  }
  .wake:focus-visible { outline: 2px solid var(--indigo); outline-offset: 1px; }
  .threads { margin-top: 11px; border-top: 1px solid var(--hairline); display: none; }
  .card.open .threads { display: block; }
  .thread { padding: 10px 0; border-bottom: 1px solid var(--hairline); font-size: 12.5px; }
  .thread:last-child { border-bottom: 0; padding-bottom: 2px; }
  .thread-head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; color: var(--text-faint); font-size: 11.5px; }
  .thread-author { color: var(--text); font-weight: 620; font-size: 12px; }
  .thread-path {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", monospace;
    color: var(--cyan); background: var(--cyan-soft); padding: 1px 6px; border-radius: 5px;
  }
  .thread-body { color: var(--text-soft); margin-top: 4px; }
  .thread-more { color: var(--cyan); white-space: nowrap; }
  .thread-more:hover { text-decoration: underline; }
  /* Same recipe as a thread's file-path chip: a branch is a "where" fact, not a state,
     and the two answer the same question — shown whole, the same way a file path is never
     edited down. Capped and truncated instead: a stacked PR's base can be another PR's
     whole slug, seventy characters long; the full name is a hover away, the way the merge
     date already is on the pill beside it. */
  .branch-badge {
    display: inline-block; max-width: 210px; vertical-align: bottom;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", monospace;
    font-size: 11px; color: var(--cyan); background: var(--cyan-soft);
    padding: 1px 6px; border-radius: 5px;
  }

  /* Same sweep as gitdeck uses for a pane awaiting content, so the two tools read
     alike while they wait. */
  .card.skeleton {
    height: 92px; border-color: transparent; box-shadow: none;
    background:
      linear-gradient(90deg, transparent, color-mix(in srgb, var(--indigo) 7%, transparent), transparent)
      0 0 / 40% 100% no-repeat var(--sunken);
    animation: sweep 1.1s ease-in-out infinite;
  }
  .card.skeleton::before { background: none; }
  @keyframes sweep { from { background-position: -40% 0; } to { background-position: 140% 0; } }

  /* Same sweep, sized to fill its grid track the way a real orbit's SVG does — so the
     skeleton is not a small island in a wide cell, and nothing jumps in size once the
     real drawing replaces it. */
  .orbit-skel {
    width: 100%; max-width: 360px; aspect-ratio: 1; border-radius: 18px;
    background:
      linear-gradient(90deg, transparent, color-mix(in srgb, var(--indigo) 7%, transparent), transparent)
      0 0 / 40% 100% no-repeat var(--sunken);
    animation: sweep 1.1s ease-in-out infinite;
  }
  .orbit-skel-caption { width: 40%; max-width: 140px; height: 12px; margin-top: 10px; border-radius: 6px; background: var(--sunken); }

  /* The button that triggered it carries the wait, and an auto-refresh shows there too:
     what it says is "a fetch is in flight", which is true either way. The glyph is a
     rotation already, so it spins rather than being swapped for a separate spinner. */
  #refresh .ic { width: 14px; height: 14px; flex: none; }
  @media (prefers-reduced-motion: no-preference) {
    #refresh.busy .ic { animation: spin .8s linear infinite; }
  }

  .empty {
    color: var(--text-faint); font-size: 13px; padding: 26px;
    border: 1px dashed var(--border); border-radius: 13px; text-align: center; margin-top: 18px;
  }
  .error {
    margin: 20px 28px 0; padding: 12px 15px; border-radius: 10px;
    background: var(--rose-soft); color: var(--rose); font-size: 13px;
  }
  /* A partial outage must be loud: a silent gap in `author` would read as
     "you have no open PRs". */
  .warning {
    margin: 20px 28px 0; padding: 12px 15px; border-radius: 10px;
    background: var(--amber-soft); color: var(--amber); font-size: 13px; font-weight: 500;
  }
  /* Indigo, not amber: a newer tool is not a data problem, it is something to do — the
     action hue on this board. */
  .update {
    margin: 20px 28px 0; padding: 12px 15px; border-radius: 10px;
    background: var(--indigo-soft); color: var(--indigo); font-size: 13px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
  }
  .update b { font-weight: 650; }
  .update code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px;
    background: var(--surface); padding: 1px 6px; border-radius: 5px;
  }
  .update .notes-act { margin-left: 0; width: auto; padding: 0 9px; font-size: 12px; color: var(--indigo); }
  .update .notes-act.done { color: var(--emerald); }
  .update .dismiss { margin-left: auto; }
  .update-titles {
    flex-basis: 100%; margin: 2px 0 0; padding-left: 18px;
    color: var(--text-soft); font-size: 12.5px; line-height: 1.55;
  }
</style>
</head>

<script>
// Refresh fetches data, it does not reload the page: the token the server stamps on
// every response says whether the assets this tab booted with are still current.
let bootVersion = null;

const state = {
  settingsOpen: false,
  sinceOpen: new Set(),
  data: null,
  lastActionCount: null,
  lastActionIds: null,
  // id → epoch ms when its rail stops glowing, or null while the tab is in the background.
  glow: new Map(),
  open: new Set(),
  timer: null,
  intervalMs: null,
  focus: null,
  repo: null,
  repos: [],
  repoOpen: false,
  repoQuery: '',
  repoActive: 0,
  snoozed: new Set(),
  revealSnoozed: false,
  editingNote: null,
  visibleMine: [],
  visibleReviews: [],
  notesText: null,
};

const el = id => document.getElementById(id);
const store = {
  get(key, fallback) {
    const raw = localStorage.getItem('pr-radar:' + key);
    return raw === null ? fallback : raw;
  },
  set(key, value) { localStorage.setItem('pr-radar:' + key, String(value)); },
};

const collapsedGroups = new Set((() => {
  try {
    return JSON.parse(localStorage.getItem('pr-radar:collapsed') ?? '[]');
  } catch {
    return [];
  }
})());

function saveCollapsed() {
  localStorage.setItem('pr-radar:collapsed', JSON.stringify([...collapsedGroups]));
}

function toggleGroup(label) {
  const key = label.dataset.group;
  const collapsed = !collapsedGroups.has(key);
  if (collapsed) collapsedGroups.add(key);
  else collapsedGroups.delete(key);
  saveCollapsed();
  label.classList.toggle('collapsed', collapsed);
  label.setAttribute('aria-expanded', String(!collapsed));
}

// Takes effect on the next render, which every caller is about to run.
function expandGroups(keys) {
  let changed = false;
  for (const key of keys) changed = collapsedGroups.delete(key) || changed;
  if (changed) saveCollapsed();
}

// Snoozing records the activity timestamp seen at the time. A PR stays hidden only
// while that timestamp holds: any new commit, comment or review brings it straight
// back. "Hide" therefore means "not until something moves", never "forget this".
//
// Any card can be snoozed, actionable ones included — an explicit product decision.
// The activity check is then the only thing bringing it back, so a snoozed PR that
// asks something of you stays hidden until someone touches it. The count in the
// summary band is what keeps that visible.
const snoozes = {
  read() {
    try {
      return JSON.parse(localStorage.getItem('pr-radar:snoozed') ?? '{}');
    } catch {
      return {};
    }
  },
  write(map) {
    localStorage.setItem('pr-radar:snoozed', JSON.stringify(map));
  },
  add(pr) {
    const map = snoozes.read();
    map[pr.id] = pr.lastActivityAt;
    snoozes.write(map);
  },
  clear() {
    localStorage.removeItem('pr-radar:snoozed');
  },
  // Prunes entries whose PR has moved on, so the store cannot drift out of sync.
  applicable(all) {
    const map = snoozes.read();
    const live = new Set();
    for (const pr of all) {
      if (map[pr.id] === pr.lastActivityAt) live.add(pr.id);
    }
    if (Object.keys(map).length !== live.size) {
      snoozes.write(Object.fromEntries([...live].map(id => [id, map[id]])));
    }
    return live;
  },
};

// A personal sticky note per PR, this browser only — never sent to GitHub, never shared
// with whoever else opens this same board. Unlike a snooze it survives ordinary activity
// on the PR (that is not what it is for); it only goes away once the PR itself is gone
// from the tool, pruned the same way a stale snooze is.
// Per browser, like the notes: a colour is a personal reading aid. Never pruned, so a repo
// that leaves the board and comes back keeps its colour.
const repoColors = {
  read() {
    try {
      return JSON.parse(localStorage.getItem('pr-radar:repoColors') ?? '{}');
    } catch {
      return {};
    }
  },
  write(map) {
    try {
      localStorage.setItem('pr-radar:repoColors', JSON.stringify(map));
    } catch {
      /* storage refused: the colour lasts until the page reloads */
    }
  },
  get(repo) {
    return repoColors.read()[repo] ?? null;
  },
  set(repo, tint) {
    const map = repoColors.read();
    if (tint) map[repo] = tint;
    else delete map[repo];
    repoColors.write(map);
  },
  seed(map) {
    if (map && localStorage.getItem('pr-radar:repoColors') === null) repoColors.write(map);
  },
};

const cardNotes = {
  read() {
    try {
      return JSON.parse(localStorage.getItem('pr-radar:notes') ?? '{}');
    } catch {
      return {};
    }
  },
  write(map) {
    localStorage.setItem('pr-radar:notes', JSON.stringify(map));
  },
  get(id) {
    return cardNotes.read()[id] ?? '';
  },
  set(id, text) {
    const map = cardNotes.read();
    if (text) map[id] = text;
    else delete map[id];
    cardNotes.write(map);
  },
  // The demo's starting notes: written once, into a browser that has none yet, so a note
  // typed or deleted while rehearsing is not undone by the next refresh.
  seed(map) {
    if (map && localStorage.getItem('pr-radar:notes') === null) cardNotes.write(map);
  },
  prune(all) {
    const map = cardNotes.read();
    const live = new Set(all.map(pr => pr.id));
    const kept = Object.keys(map).filter(id => live.has(id));
    if (kept.length !== Object.keys(map).length) {
      cardNotes.write(Object.fromEntries(kept.map(id => [id, map[id]])));
    }
  },
};

// What each card looked like when you last looked at it, in this browser only, so a card
// can say what moved since. A card met for the first time is a baseline, not news: it
// already gets the chime and the glowing rail when it asks for something.
const seen = {
  read() {
    try {
      return JSON.parse(localStorage.getItem('pr-radar:seen') ?? '{}');
    } catch {
      return {};
    }
  },
  write(map) {
    try {
      localStorage.setItem('pr-radar:seen', JSON.stringify(map));
    } catch {
      /* private window, storage refused: the line simply never shows */
    }
  },
  // The demo's photos, written again whenever the demo server restarts: its dates start
  // from the restart, so older photos would all read as changed.
  seed(map, startedAt) {
    if (!map) return;
    try {
      if (localStorage.getItem('pr-radar:seen-demo') === String(startedAt)) return;
      seen.write(map);
      localStorage.setItem('pr-radar:seen-demo', String(startedAt));
    } catch {
      /* storage refused: no line, as on the real board */
    }
  },
  mark(prs) {
    const map = seen.read();
    for (const pr of prs) map[pr.id] = PRRadarSince.snapshotOf(pr);
    seen.write(map);
  },
  sync(all) {
    const map = seen.read();
    const live = new Set(all.map(pr => pr.id));
    let dirty = false;
    for (const pr of all) {
      if (map[pr.id]) continue;
      map[pr.id] = PRRadarSince.snapshotOf(pr);
      dirty = true;
    }
    for (const id of Object.keys(map)) {
      if (live.has(id)) continue;
      delete map[id];
      dirty = true;
    }
    if (dirty) seen.write(map);
    return map;
  },
};

const I18N = {
  fr: {
    agoUnits: ['s', 'min', 'h', 'j', 'sem'],
    everyMinutes: '{n} min',
    everySeconds: '{n} s',
    opened: 'ouverte il y a {v}',
    activeAgo: 'active il y a {v}',
    openedTitle: 'ouverture de la PR — {date}',
    ago: 'il y a {v}',
    agoTitle: 'dernière activité réelle : commit, commentaire ou review',
    stampTitle: 'dernier fetch — rafraîchissement automatique toutes les {every}',
    warning_one: 'Données incomplètes : {sources} n’a pas répondu. Le reste est à jour.',
    warning_many: 'Données incomplètes : {sources} n’ont pas répondu. Le reste est à jour.',
    slackNoConnector: 'Lien Slack désactivé : Claude n’a pas de connecteur Slack. Active-le sur claude.ai (Paramètres → Connecteurs), puis redémarre pr-radar. Le board, lui, est à jour.',
    slackFailed: 'Lien Slack indisponible ({message}) : les liens vers les annonces peuvent manquer. Le board, lui, est à jour.',
    updateTitle: 'Nouvelle version disponible',
    updateBehind_one: '{n} commit en retard.',
    updateBehind_many: '{n} commits en retard.',
    updateHow: 'Dans un terminal, dans le dossier pr-radar : {command}, puis redémarre le serveur.',
    updateCopy: 'Copier',
    updateCopied: 'Copié',
    updateMore: 'et {n} de plus',

// A view is a preference, unlike a filter: reopening on the one left behind is what you
// asked for, where reopening on a filtered board would look like an empty one.
function applyView(next) {
  view = next;
  store.set('view', next);
  for (const span of el('view').querySelectorAll('span')) {
    span.classList.toggle('on', span.dataset.view === next);
  }
  document.querySelector('main').hidden = next !== 'board';
  el('orbits').hidden = next !== 'orbits';
}

el('view').addEventListener('click', () => applyView(view === 'board' ? 'orbits' : 'board'));

function applySound(next) {
  soundOn = next;
  store.set('sound', String(next));
  el('sound').classList.toggle('off', !next);
  el('sound').setAttribute('aria-pressed', String(next));
  el('sound').title = t(next ? 'soundOn' : 'soundOff');
}

el('sound').addEventListener('click', () => applySound(!soundOn));

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  el('theme').textContent = theme === 'dark' ? '☀' : '☾';
}
applyTheme(store.get('theme', 'light'));
el('theme').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  store.set('theme', next);
  applyTheme(next);
});

function applyLang(next) {
  lang = next;
  store.set('lang', next);
  document.documentElement.lang = next;

  for (const span of el('lang').querySelectorAll('span')) {
    span.classList.toggle('on', span.dataset.lang === next);
  }
  el('lang').title = t('langTitle');
  el('theme').title = t('themeTitle');
  el('settings').title = t('settingsTitle');
  if (state.settingsOpen) renderSettings();
  el('gitdeck').title = t('gitdeckTitle');
  applyStampTitle();
  el('refreshLabel').textContent = t('refresh');
  el('reload').textContent = t('reload');
  el('reload').title = t('reloadTitle');
  el('notes').innerHTML = `${NOTES_ICON}<span id="notesLabel">${t('notes')}</span>`;
  el('notes').title = t('notesTitle');
  applyScopeLabel();
  restoreCopy();
  el('sound').innerHTML = SOUND_ICON;
  applySound(soundOn);
  applyView(view);
  el('view').title = t('viewTitle');
  el('titleMine').textContent = t('titleMine');
  el('titleReviews').textContent = t('titleReviews');

  // The notes are prose from a model, not labels: only a rewrite translates them. The
  // per-language cache makes a switch back instant.
  if (!el('notesPanel').hidden) writeNotes();
}

function applyStampTitle() {
  const seconds = state.data?.refreshSeconds;
  const every = !seconds
    ? '—'
    : seconds >= 120
      ? t('everyMinutes', { n: Math.round(seconds / 60) })
      : t('everySeconds', { n: seconds });
  el('stamp').title = t('stampTitle', { every });
}

// A failed fetch raises the banner; a merely late one would age in silence. Computed only
// at render time the mark would never show, a render following its fetch by milliseconds,
// so it runs on its own clock.
function renderStamp() {
  el('stamp').textContent = new Date(state.data.fetchedAt).toLocaleTimeString(LOCALE[lang], { hour: '2-digit', minute: '2-digit' });
  renderStampAge();
}

function renderStampAge() {
  const fetchedAt = state.data && new Date(state.data.fetchedAt).getTime();
  el('stamp').classList.toggle(
    'aged',
    Boolean(fetchedAt) && Date.now() - fetchedAt > (state.data.refreshSeconds ?? 300) * 2000,
  );
}
setInterval(renderStampAge, 30_000);

// The interval comes from the server (PR_RADAR_REFRESH_SECONDS); re-tune it on the fly.
function scheduleRefresh(seconds) {
  const intervalMs = Math.max(15, seconds || 300) * 1000;
  if (state.intervalMs === intervalMs) return;
  state.intervalMs = intervalMs;
  clearInterval(state.timer);
  state.timer = setInterval(() => load(false), intervalMs);
}

let audio = null;
let customSound = null;

// PR_RADAR_SOUND set: the reader's own file, played in full. Any failure to play it (the
// file moved, a format the browser cannot read) falls back to the built-in chime.
function beep() {
  if (!soundOn) return;
  if (state.data?.customSound) {
    customSound ??= new Audio('/sound');
    customSound.currentTime = 0;
    customSound.play().catch(chime);
    return;
  }
  chime();
}

function chime() {
  // One context for the page: a document may only hold a handful, and a tool left open all
  // day would beep its way past the cap.
  audio ??= new (window.AudioContext || window.webkitAudioContext)();
  // A tab nobody has touched has never granted audio, so the context starts suspended.
  audio.resume().catch(() => {});
  const now = audio.currentTime;
  [660, 880].forEach((freq, index) => {
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, now + index * 0.15);
    gain.gain.linearRampToValueAtTime(0.1, now + index * 0.15 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.15 + 0.14);
    osc.connect(gain).connect(audio.destination);
    osc.start(now + index * 0.15);
    osc.stop(now + index * 0.15 + 0.15);
  });
}

const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
}[c]));

// Escaped first, linked second: a pasted `<a href="...">` is inert text here, never a tag
// — the only markup this ever produces is the anchor built below, around a bare URL.
const NOTE_URL_RE = /(https?:\/\/[^\s<>"']+)/g;
const linkifyNote = text =>
  escapeHtml(text).replace(NOTE_URL_RE, url => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`);

function ago(iso) {
  if (!iso) return '';
  const units = I18N[lang].agoUnits;
  const steps = [60, 60, 24, 7, Infinity];
  let value = (Date.now() - new Date(iso)) / 1000;
  for (const [index, step] of steps.entries()) {
    if (value < step) return `${Math.max(1, Math.round(value))} ${units[index]}`;
    value /= step;
  }
  return '';
}

const since = iso => t('ago', { v: ago(iso) });

const onDate = iso => new Date(iso)
  .toLocaleDateString(LOCALE[lang], { day: 'numeric', month: 'long', year: 'numeric' });

const pill = (kind, label, title) =>
