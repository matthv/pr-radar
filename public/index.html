<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Radar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Cpath%20d='M16,16L16,4.5A11.5,11.5,0,0,1,25.96,10.25Z'%20fill='%23514ab8'%20opacity='.3'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='12.6'%20fill='none'%20stroke='%23514ab8'%20stroke-width='2.4'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='6.8'%20fill='none'%20stroke='%23514ab8'%20stroke-width='1.7'%20opacity='.38'/%3E%3Ccircle%20cx='20.6'%20cy='9.45'%20r='3.6'%20fill='%23514ab8'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f6fb;
    --bg-accent: radial-gradient(1200px 320px at 12% -10%, #e9e7fd 0%, transparent 70%),
                 radial-gradient(900px 280px at 88% -14%, #e2f2f7 0%, transparent 70%);
    --surface: #ffffff;
    --sunken: #f1f1f7;
    --border: #e5e4f0;
    --hairline: #eeedf6;
    --text: #1d1e28;
    --text-soft: #575a6b;
    --text-faint: #8e91a6;

    --indigo: #5a51d4;
    --indigo-2: #8b5cf6;
    --indigo-soft: #eeecfd;
    --amber: #a8710a;
    --amber-2: #d99a1e;
    --amber-soft: #fdf3e0;
    --emerald: #0f7f61;
    --emerald-2: #2fb389;
    --emerald-soft: #e4f5ef;
    --rose: #c04440;
    --rose-2: #e0716c;
    --rose-soft: #fdedec;
    --cyan: #0d7490;
    --cyan-2: #2aa5c0;
    --cyan-soft: #e2f2f7;

    --link: #4f46c8;
    --shadow-sm: 0 1px 2px rgba(29, 30, 40, .05);
    --shadow-md: 0 6px 18px -6px rgba(60, 50, 140, .18), 0 2px 4px rgba(29, 30, 40, .04);
  }

  :root[data-theme="dark"] {
    --bg: #101219;
    --bg-accent: radial-gradient(1200px 320px at 12% -10%, #1e1b3d 0%, transparent 70%),
                 radial-gradient(900px 280px at 88% -14%, #102d38 0%, transparent 70%);
    --surface: #191c26;
    --sunken: #15171f;
    --border: #292d3b;
    --hairline: #222634;
    --text: #e7e8f0;
    --text-soft: #a4a8bd;
    --text-faint: #757a92;

    --indigo: #a29bf5;
    --indigo-2: #c4b5fd;
    --indigo-soft: #241f4d;
    --amber: #e0b264;
    --amber-2: #f0cd91;
    --amber-soft: #33270e;
    --emerald: #5fcda6;
    --emerald-2: #8ee0c2;
    --emerald-soft: #102b23;
    --rose: #e79a95;
    --rose-2: #f0b8b4;
    --rose-soft: #341d1d;
    --cyan: #63c6dd;
    --cyan-2: #93dbeb;
    --cyan-soft: #102b34;

    --link: #a5a0f5;
    --shadow-sm: none;
    --shadow-md: 0 8px 22px -10px rgba(0, 0, 0, .6);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 16px 28px;
    background-color: var(--bg);
    background-image: var(--bg-accent);
    border-bottom: 1px solid var(--border);
    backdrop-filter: saturate(1.2);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 15.5px; font-weight: 680; letter-spacing: -.2px; }
  .brand em { font-style: normal; font-weight: 450; color: var(--text-faint); font-size: 13px; letter-spacing: 0; }
  .logo { width: 26px; height: 26px; flex: none; color: var(--indigo); }
  .logo .sweep { fill: url(#sweepGrad); opacity: .8; transform-origin: 16px 16px; }
  .logo .blip { fill: var(--indigo); }
  @media (prefers-reduced-motion: no-preference) {
    .logo .sweep { animation: spin 4.5s linear infinite; }
    .logo .blip { animation: pulse 2.2s ease-in-out infinite; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { opacity: 1; r: 3.4px; } 50% { opacity: .6; r: 2.8px; } }

  /* The counters left the header: this is a summary of the content, not a control of
     the tool. Sitting above the columns they summarise, they may carry a container
     again — now that they filter, the box no longer lies. */
  /* Hidden until the first payload: the project picker rendered as an empty box, and
     an empty control is worse than no control. */
  .summary[hidden] { display: none; }
  .summary {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
    padding: 20px 28px 0;
  }
  .counters { display: flex; gap: 8px; flex-wrap: wrap; }
  .counter {
    display: flex; align-items: center; gap: 8px;
    font: inherit; font-size: 12px; color: var(--text-soft); text-align: left;
    padding: 6px 11px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: background .15s, border-color .15s, box-shadow .18s, transform .18s;
  }
  .counter:hover:not([disabled]) {
    border-color: color-mix(in srgb, var(--indigo) 40%, transparent);
    box-shadow: var(--shadow-md); transform: translateY(-1px);
  }
  .counter.pending:hover:not([disabled]) {
    border-color: color-mix(in srgb, var(--amber) 45%, transparent);
  }
  .counter.on {
    background: var(--indigo-soft);
    border-color: color-mix(in srgb, var(--indigo) 45%, transparent);
  }
  .counter.pending.on {
    background: var(--amber-soft);
    border-color: color-mix(in srgb, var(--amber) 50%, transparent);
  }
  .counter:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }
  .counter[disabled] { cursor: default; background: transparent; box-shadow: none; }
  .counter b {
    font-size: 16px; font-weight: 680; letter-spacing: -.4px; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .counter .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .counter.todo b { color: var(--indigo); }
  .counter.todo .dot { background: linear-gradient(135deg, var(--indigo), var(--indigo-2)); }
  .counter.pending b { color: var(--amber); }
  .counter.pending .dot { background: linear-gradient(135deg, var(--amber), var(--amber-2)); }
  .counter.zero { color: var(--text-faint); border-color: var(--hairline); }
  .counter.zero b { color: var(--text-faint); font-weight: 550; }
  .counter.zero .dot { background: var(--border); }
  /* The chevron says "this leads somewhere" without crowding: faint at rest, plain on
     hover and while the filter is on. */
  .counter .go { font-size: 11px; opacity: .3; transition: opacity .15s, transform .15s; }
  .counter:hover:not([disabled]) .go { opacity: .8; transform: translateX(2px); }
  .counter.on .go { opacity: .8; }
  .counter[disabled] .go { display: none; }

  .spacer { flex: 1 1 auto; }
  .controls { display: flex; align-items: center; gap: 15px; font-size: 12.5px; color: var(--text-soft); }
  label.toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  label.toggle input { accent-color: var(--indigo); margin: 0; }
  #reload { color: var(--amber); background: var(--amber-soft); border-color: transparent; }
  #reload:hover { color: var(--amber); border-color: var(--amber); }
  #stamp { color: var(--text-faint); font-variant-numeric: tabular-nums; }
  #stamp.aged { color: var(--amber); font-weight: 600; }
  #stamp.aged::after { content: " ⚠"; }
  .stale { font-size: 12.5px; color: var(--text-faint); margin-left: auto; }
  /* Interactive, so it gets a container — same rule as the toolbar controls. Its
     options live outside `.controls`, so they do not inherit that boxed look. */
  .picker { position: relative; }
  .picker-trigger {
    display: flex; align-items: center; gap: 8px;
    font: inherit; font-size: 12px; color: var(--text-soft); cursor: pointer;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 6px 11px; box-shadow: var(--shadow-sm);
    transition: border-color .15s, background .15s;
  }
  .picker-trigger:hover { border-color: color-mix(in srgb, var(--indigo) 40%, transparent); }
  .picker-trigger.on {
    background: var(--indigo-soft); color: var(--indigo); font-weight: 600;
    border-color: color-mix(in srgb, var(--indigo) 45%, transparent);
  }
  .picker-trigger:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }
  .picker-trigger .caret { font-size: 9px; opacity: .5; }

  .picker-panel {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 20;
    width: 270px; padding: 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow-md);
  }
  .picker-panel input {
    width: 100%; font: inherit; font-size: 12.5px; color: var(--text);
    background: var(--sunken); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 9px; margin-bottom: 6px;
  }
  .picker-panel input:focus { outline: none; border-color: var(--indigo); }
  .picker-list { max-height: 270px; overflow-y: auto; display: flex; flex-direction: column; }
  .picker-option {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font: inherit; font-size: 12.5px; text-align: left; color: var(--text-soft);
    background: none; border: 0; border-radius: 7px; padding: 6px 8px; cursor: pointer;
  }
  .picker-option:hover, .picker-option.active { background: var(--hairline); color: var(--text); }
  .picker-option[aria-selected="true"] { color: var(--indigo); font-weight: 620; }
  .picker-option .n { flex: none; font-size: 11.5px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .picker-option .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .picker-empty { font-size: 12px; color: var(--text-faint); padding: 10px; text-align: center; }

  /* The boxed-control look is reserved for the toolbar. The page's other <button>s —
     counters, expanders — are not controls of the tool and used to inherit that box by
     accident. */
  .controls button {
    font: inherit; font-size: 12.5px; font-weight: 520; cursor: pointer; color: var(--text-soft);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 9px; padding: 6px 12px; box-shadow: var(--shadow-sm);
    transition: color .15s, border-color .15s, transform .15s;
  }
  .controls button:hover { color: var(--indigo); border-color: var(--indigo); transform: translateY(-1px); }
  #theme { padding: 6px 10px; }
  /* gitdeck now shares PR Radar's indigo: tinting it would make it read as an action of
     PR Radar competing with Refresh. The button stays neutral like the other controls,
     and its mark does the identifying. */
  a.link-out {
    display: none; align-items: center; gap: 7px;
    font-size: 12.5px; font-weight: 520; color: var(--text-soft);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 9px; padding: 6px 11px; box-shadow: var(--shadow-sm);
    transition: color .15s, border-color .15s, transform .15s;
  }
  a.link-out[href] { display: inline-flex; }
  a.link-out:hover { color: var(--indigo); border-color: var(--indigo); transform: translateY(-1px); }
  a.link-out svg { width: 15px; height: 15px; flex: none; }
  @media (prefers-reduced-motion: no-preference) {
    a.link-out:hover .branch-tip { animation: blip 1.6s ease-in-out infinite; }
  }
  @keyframes blip { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  .seg { display: flex; gap: 3px; padding: 3px; }
  .seg span {
    padding: 3px 9px; border-radius: 6px; font-size: 12.5px; font-weight: 620;
    letter-spacing: .3px; color: var(--text-faint); transition: color .15s, background .15s;
  }
  .seg span.on { background: linear-gradient(135deg, var(--indigo), var(--indigo-2)); color: #fff; }
  .seg:hover { border-color: var(--indigo); }
  #refresh { color: #fff; font-weight: 620; background: linear-gradient(135deg, var(--indigo), var(--indigo-2)); border-color: transparent; }
  #refresh:hover { color: #fff; border-color: transparent; filter: brightness(1.07); }

  main { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; padding: 22px 28px 70px; align-items: start; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; gap: 26px; } }
  /* An active counter isolates its column: full width, the other collapsed. */
  main[data-focus="mine"], main[data-focus="reviews"] { grid-template-columns: 1fr; }
  /* Full width on a wide screen would leave the card's age a thousand pixels from the
     rest of its line. */
  main[data-focus] section { max-width: 940px; }
  main[data-focus="mine"] .col-review, main[data-focus="reviews"] .col-mine { display: none; }

  .col-mine { --col: var(--indigo); --col-2: var(--indigo-2); }
  .col-review { --col: var(--cyan); --col-2: var(--cyan-2); }

  .column-title {
    display: flex; align-items: center; gap: 9px;
    font-size: 13.5px; font-weight: 680; letter-spacing: -.1px; margin: 0 0 6px;
    padding-bottom: 11px; border-bottom: 1px solid var(--border); position: relative;
  }
  .column-title::after {
    content: ""; position: absolute; left: 0; bottom: -1px; width: 46px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, var(--col), var(--col-2));
  }
  .column-title .bar { width: 4px; height: 15px; border-radius: 3px; background: linear-gradient(180deg, var(--col), var(--col-2)); }

  .group-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 620; letter-spacing: .5px; text-transform: uppercase;
    color: var(--text-faint); margin: 24px 0 10px;
  }
  .group-label:first-of-type { margin-top: 18px; }
  .group-label .gdot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .group-label.action .gdot { background: linear-gradient(135deg, var(--indigo), var(--indigo-2)); }
  .group-label.waiting .gdot,
  .group-label.merged .gdot { background: linear-gradient(135deg, var(--amber), var(--amber-2)); }
  .group-label.idle .gdot { background: var(--border); }
  .group-label.action { color: var(--indigo); }
  .group-label.waiting, .group-label.merged { color: var(--amber); }
  .group-label.merged.settled { color: var(--emerald); }
  .group-label.merged.settled .gdot { background: linear-gradient(135deg, var(--emerald), var(--emerald-2)); }
  .group-label.merged.settled .gcount { background: var(--emerald-soft); color: var(--emerald); }
  .group-label .gcount {
    font-size: 10.5px; letter-spacing: 0; padding: 1px 6px; border-radius: 20px;
    background: var(--hairline); color: var(--text-faint);
  }
  .group-label.action .gcount { background: var(--indigo-soft); color: var(--indigo); }
  .group-label.waiting .gcount,
  .group-label.merged .gcount { background: var(--amber-soft); color: var(--amber); }

  .card {
    position: relative; overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 13px;
    box-shadow: var(--shadow-sm);
    padding: 14px 16px 14px 18px;
    margin-bottom: 10px;
    transition: box-shadow .18s, transform .18s;
  }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .card.action::before { background: linear-gradient(180deg, var(--indigo), var(--indigo-2)); }
  .card.waiting::before,
  .card.merged::before { background: linear-gradient(180deg, var(--amber), var(--amber-2)); }
  .card.action { background: linear-gradient(100deg, var(--indigo-soft) -10%, var(--surface) 42%); }
  .card.waiting,
  .card.merged { background: linear-gradient(100deg, var(--amber-soft) -10%, var(--surface) 42%); }

  /* The release outcome paints the whole card, not just a pill: after a merge it is the
     only thing left to know. Amber while it runs — the outcome is not known yet, and
     green would announce a success that has not happened. */
  .card.pipeline-done { background: linear-gradient(100deg, var(--emerald-soft) -10%, var(--surface) 45%); }
  .card.pipeline-done::before { background: linear-gradient(180deg, var(--emerald), var(--emerald-2)); }
  .card.pipeline-failed { background: linear-gradient(100deg, var(--rose-soft) -10%, var(--surface) 45%); }
  .card.pipeline-failed::before { background: linear-gradient(180deg, var(--rose), var(--rose-2)); }
  .card.pipeline-failed .reason { color: var(--rose); }

  /* A gradient's stops cannot be animated, so the breathing lives on an overlay whose
     opacity can. Content is lifted above it. */
  .card.pipeline-running::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background: linear-gradient(100deg, var(--amber-soft) -10%, transparent 55%);
  }
  .card > * { position: relative; z-index: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .card.pipeline-running::after { animation: breathe 1.8s ease-in-out infinite; }
  }
  .card.idle { background: var(--sunken); border-color: transparent; box-shadow: none; padding-left: 16px; }
  /* Green only once nothing is left to do. On a card that still asks something, it
     would overwrite the "your move" signal in the very channel that carries it — and
     an approved PR whose author has since replied is still your move. */
  .card.idle.approved {
    /* Same recipe as the action and waiting cards — fading to --sunken instead left the
       card green on the left and grey on the right. */
    background: linear-gradient(100deg, var(--emerald-soft) -10%, var(--surface) 45%);
    border-color: var(--border);
    box-shadow: var(--shadow-sm);
    padding-left: 18px;
  }
  .card.idle.approved::before { background: linear-gradient(180deg, var(--emerald), var(--emerald-2)); }
  /* Whatever presents as a full card lifts on hover. Only the plain receding ones stay
     put — and an approved card is not one of them, since it kept its border and shadow. */
  .card:not(.idle):hover,
  .card.approved:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }

  .card-top { display: flex; gap: 9px; align-items: baseline; flex-wrap: wrap; }
  .age {
    flex: none; margin-left: auto; white-space: nowrap;
    font-size: 11.5px; color: var(--text-faint); font-variant-numeric: tabular-nums;
  }
  /* Cyan is already "where" in this palette — it is what a thread's file path wears.
     A repo name is a location too, and grey made it indistinguishable from the neutral
     state pills, which answer "what". 4.67:1 in light, 7.52 in dark. */
  .repo {
    font-size: 11.5px; font-weight: 550; padding: 2px 7px; border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", monospace;
    background: var(--cyan-soft); color: var(--cyan); white-space: nowrap;
  }
  .title { font-weight: 620; font-size: 14.5px; letter-spacing: -.15px; flex: 1 1 240px; }
  .title:hover { color: var(--link); }

  .meta { display: flex; flex-wrap: wrap; gap: 6px 9px; margin-top: 10px; font-size: 12px; color: var(--text-faint); align-items: center; }
  /* The separator is generated on the element it precedes, so it wraps with it and can
     never be left orphaned at the end of a line. */
  .meta .sep::before { content: "|"; color: var(--border); margin-right: 9px; }
  .who { display: flex; align-items: center; gap: 6px; }
  .stack { display: flex; flex: none; }
  .face {
    display: block; position: relative;
    width: 18px; height: 18px; border-radius: 50%; flex: none; overflow: hidden;
    background: var(--hairline); border: 1.5px solid var(--surface);
    transition: box-shadow .15s, transform .15s;
  }
  .face img { width: 100%; height: 100%; display: block; object-fit: cover; }
  /* Overlap: the faces read as a queue, the original author in front. */
  .stack .face + .face { margin-left: -6px; }
  /* Raised on hover so the growing face is not clipped under the next one. */
  .face:hover { box-shadow: 0 0 0 2px var(--indigo); transform: scale(1.12); z-index: 1; }
  .face:focus-visible { outline: 2px solid var(--indigo); outline-offset: 1px; z-index: 1; }
  .card.action .face { border-color: var(--surface); }
  .card.idle .face { border-color: var(--sunken); }

  .pill {
    padding: 2.5px 8px; border-radius: 7px; font-size: 11.5px; font-weight: 580;
    background: var(--hairline); color: var(--text-soft);
  }
  .pill.todo { background: var(--indigo-soft); color: var(--indigo); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--indigo) 18%, transparent); }
  .pill.pending { background: var(--amber-soft); color: var(--amber); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--amber) 18%, transparent); }
  .pill.good { background: var(--emerald-soft); color: var(--emerald); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--emerald) 18%, transparent); }
  .pill.alert { background: var(--rose-soft); color: var(--rose); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--rose) 18%, transparent); }
  /* A running pipeline breathes: the card is a live thing until the verdict lands. */
  @media (prefers-reduced-motion: no-preference) {
    .pill.running { animation: breathe 1.8s ease-in-out infinite; }
  }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

  .reasons { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
  .reason { font-size: 12.5px; font-weight: 500; color: var(--text-soft); display: flex; gap: 8px; }
  .reason::before { content: ""; flex: none; width: 3px; border-radius: 2px; background: currentColor; opacity: .4; }
  .card.action .reason { color: var(--indigo); }
  .card.waiting .reason, .card.merged .reason { color: var(--amber); }

  .expander {
    font: inherit; font-size: 12px; font-weight: 520; color: var(--text-faint);
    background: none; border: 0; padding: 0; cursor: pointer;
    margin-top: 11px; display: inline-block;
  }
  .expander:hover { color: var(--link); }
  .expander:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; border-radius: 4px; }

  /* Bottom row: threads on the left, snooze on the right. The row exists even with no
     thread to expand, so the anchor never moves. */
  .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

  /* Offered on every card. Visible on hover, and permanently once snoozed — otherwise
     nothing would say which card is asleep while they are revealed. */
  .snooze {
    display: flex; align-items: center; gap: 6px;
    flex: none; margin-top: 11px;
    font: inherit; font-size: 11.5px; line-height: 1.2; color: var(--text-faint);
    background: none; border: 0; padding: 3px 7px; border-radius: 7px;
    cursor: pointer; opacity: 0; transition: opacity .15s, background .15s, color .15s;
  }
  .card:hover .snooze, .snooze:focus-visible { opacity: 1; }
  .snooze:hover { background: var(--hairline); color: var(--text-soft); }
  .snooze:focus-visible { outline: 2px solid var(--indigo); outline-offset: 1px; }
  .card.snoozed .snooze { opacity: 1; background: var(--hairline); color: var(--text-soft); }
  .card.snoozed { opacity: .55; }
  .card.snoozed:hover { opacity: 1; }

  /* A set of PRs that one click reveals: the same species as the counters, so it takes
     the same tile rather than a third pattern. Neutral, because a snooze is not a
     priority. The secondary action only appears once the set is revealed. */
  .snoozed-note { display: flex; align-items: center; gap: 6px; }
  .counter.asleep { color: var(--text-faint); }
  .counter.asleep b { color: var(--text-soft); }
  .glyph { width: 8px; height: 10px; flex: none; opacity: .75; }
  .counter.asleep.on { background: var(--hairline); border-color: var(--border-strong, var(--border)); }
  /* Same family as the tiles — radius, padding — but transparent at rest, so it reads
     as subordinate to the one it belongs to rather than as bare floating text. */
  .wake {
    display: flex; align-items: center; gap: 6px;
    font: inherit; font-size: 12px; color: var(--text-faint); cursor: pointer;
    background: none; border: 1px solid transparent; border-radius: 10px;
    padding: 6px 10px;
    transition: color .15s, background .15s, border-color .15s;
  }
  .wake:hover {
    color: var(--indigo); background: var(--indigo-soft);
    border-color: color-mix(in srgb, var(--indigo) 30%, transparent);
  }
  .wake:focus-visible { outline: 2px solid var(--indigo); outline-offset: 1px; }
  .threads { margin-top: 11px; border-top: 1px solid var(--hairline); display: none; }
  .card.open .threads { display: block; }
  .thread { padding: 10px 0; border-bottom: 1px solid var(--hairline); font-size: 12.5px; }
  .thread:last-child { border-bottom: 0; padding-bottom: 2px; }
  .thread-head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; color: var(--text-faint); font-size: 11.5px; }
  .thread-author { color: var(--text); font-weight: 620; font-size: 12px; }
  .thread-path {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", monospace;
    color: var(--cyan); background: var(--cyan-soft); padding: 1px 6px; border-radius: 5px;
  }
  .thread-body { color: var(--text-soft); margin-top: 4px; }

  /* Same sweep as gitdeck uses for a pane awaiting content, so the two tools read
     alike while they wait. */
  .card.skeleton {
    height: 92px; border-color: transparent; box-shadow: none;
    background:
      linear-gradient(90deg, transparent, color-mix(in srgb, var(--indigo) 7%, transparent), transparent)
      0 0 / 40% 100% no-repeat var(--sunken);
    animation: sweep 1.1s ease-in-out infinite;
  }
  .card.skeleton::before { background: none; }
  @keyframes sweep { from { background-position: -40% 0; } to { background-position: 140% 0; } }

  /* The button that triggered it carries the wait, and an auto-refresh shows there too:
     what it says is "a fetch is in flight", which is true either way. The glyph is a
     rotation already, so it spins rather than being swapped for a separate spinner. */
  #refresh { display: inline-flex; align-items: center; gap: 7px; }
  #refresh .ic { width: 14px; height: 14px; flex: none; }
  @media (prefers-reduced-motion: no-preference) {
    #refresh.busy .ic { animation: spin .8s linear infinite; }
  }

  .empty {
    color: var(--text-faint); font-size: 13px; padding: 26px;
    border: 1px dashed var(--border); border-radius: 13px; text-align: center; margin-top: 18px;
  }
  .error {
    margin: 20px 28px 0; padding: 12px 15px; border-radius: 10px;
    background: var(--rose-soft); color: var(--rose); font-size: 13px;
  }
  /* A partial outage must be loud: a silent gap in `author` would read as
     "you have no open PRs". */
  .warning {
    margin: 20px 28px 0; padding: 12px 15px; border-radius: 10px;
    background: var(--amber-soft); color: var(--amber); font-size: 13px; font-weight: 500;
  }
</style>

const store = {
  get(key, fallback) {
    const raw = localStorage.getItem('pr-radar:' + key);
    return raw === null ? fallback : raw;

  set(key, value) { localStorage.setItem('pr-radar:' + key, String(value)); },
};

// Snoozing records the activity timestamp seen at the time. A PR stays hidden only
// while that timestamp holds: any new commit, comment or review brings it straight
// back. "Hide" therefore means "not until something moves", never "forget this".
//
// Any card can be snoozed, actionable ones included — an explicit product decision.
// The activity check is then the only thing bringing it back, so a snoozed PR that
// asks something of you stays hidden until someone touches it. The count in the
// summary band is what keeps that visible.
const snoozes = {
  read() {
    try {
      return JSON.parse(localStorage.getItem('pr-radar:snoozed') ?? '{}');
    } catch {
      return {};
    }
  },
  write(map) {
    localStorage.setItem('pr-radar:snoozed', JSON.stringify(map));
  },
  add(pr) {
    const map = snoozes.read();
    map[pr.id] = pr.lastActivityAt;
    snoozes.write(map);
  },
  clear() {
    localStorage.removeItem('pr-radar:snoozed');
  },
  // Prunes entries whose PR has moved on, so the store cannot drift out of sync.
  applicable(all) {
    const map = snoozes.read();
    const live = new Set();
    for (const pr of all) {
      if (map[pr.id] === pr.lastActivityAt) live.add(pr.id);
    }
    if (Object.keys(map).length !== live.size) {
      snoozes.write(Object.fromEntries([...live].map(id => [id, map[id]])));
    }
    return live;
  },
};

const PLURAL = { fr: n => (n > 1 ? 'many' : 'one'), en: n => (n === 1 ? 'one' : 'many') };
const LOCALE = { fr: 'fr-FR', en: 'en-GB' };

let lang = I18N[store.get('lang', 'en')] ? store.get('lang', 'en') : 'en';

const t = (key, vars) =>
  String(I18N[lang][key] ?? key).replace(/\{(\w+)\}/g, (_, name) => vars?.[name] ?? '');

const tn = (key, n, vars) => t(`${key}_${PLURAL[lang](n)}`, { n, ...vars });

for (const key of ['onlyAction', 'hideBots', 'hideDrafts', 'sound']) {
  el(key).checked = store.get(key, String(key === 'sound')) === 'true';
  el(key).addEventListener('change', () => {
    store.set(key, el(key).checked);
    render();
  });
}

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  el('theme').textContent = theme === 'dark' ? '☀' : '☾';
}
applyTheme(store.get('theme', 'light'));
el('theme').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  store.set('theme', next);
  applyTheme(next);
});

function applyLang(next) {
  lang = next;
  store.set('lang', next);
  document.documentElement.lang = next;

  for (const span of el('lang').querySelectorAll('span')) {
    span.classList.toggle('on', span.dataset.lang === next);
  }
  el('lang').title = t('langTitle');
  el('theme').title = t('themeTitle');
  el('gitdeck').title = t('gitdeckTitle');
  applyStampTitle();
  el('refreshLabel').textContent = t('refresh');
  el('reload').textContent = t('reload');
  el('reload').title = t('reloadTitle');
  el('lblOnlyAction').textContent = t('filterAction');
  el('lblHideBots').textContent = t('filterBots');
  el('lblHideDrafts').textContent = t('filterDrafts');
  el('lblSound').textContent = t('filterSound');
  el('titleMine').textContent = t('titleMine');
  el('titleReviews').textContent = t('titleReviews');
  render();
}
el('lang').addEventListener('click', () => applyLang(lang === 'fr' ? 'en' : 'fr'));

function applyStampTitle() {
  const seconds = state.data?.refreshSeconds;
  const every = !seconds
    ? '—'
    : seconds >= 120
      ? t('everyMinutes', { n: Math.round(seconds / 60) })
      : t('everySeconds', { n: seconds });
  el('stamp').title = t('stampTitle', { every });
}

// The interval comes from the server (PR_RADAR_REFRESH_SECONDS); re-tune it on the fly.
function scheduleRefresh(seconds) {
  const intervalMs = Math.max(15, seconds || 300) * 1000;
  if (state.intervalMs === intervalMs) return;
  state.intervalMs = intervalMs;
  clearInterval(state.timer);
  state.timer = setInterval(() => load(false), intervalMs);
}

function beep() {
  if (!el('sound').checked) return;
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const now = ctx.currentTime;
  [660, 880].forEach((freq, index) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, now + index * 0.15);
    gain.gain.linearRampToValueAtTime(0.1, now + index * 0.15 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.15 + 0.14);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now + index * 0.15);
    osc.stop(now + index * 0.15 + 0.15);
  });
}

const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
}[c]));

function ago(iso) {
  if (!iso) return '';
  const units = I18N[lang].agoUnits;
  const steps = [60, 60, 24, 7, Infinity];
  let value = (Date.now() - new Date(iso)) / 1000;
  for (const [index, step] of steps.entries()) {
    if (value < step) return `${Math.max(1, Math.round(value))} ${units[index]}`;
    value /= step;
  }
  return '';
}

const since = iso => t('ago', { v: ago(iso) });

const onDate = iso => new Date(iso)
  .toLocaleDateString(LOCALE[lang], { day: 'numeric', month: 'long', year: 'numeric' });

function visibleThreads(threads) {
  return el('hideBots').checked ? threads.filter(thread => !thread.fromBot) : threads;
}

const pill = (kind, label, title) =>
  `<span class="pill${kind ? ' ' + kind : ''}"${title ? ` title="${escapeHtml(title)}"` : ''}>${label}</span>`;

const MAX_FACES = 4;
const MAX_BOT_PILLS = 3;

// Drawn rather than typed: a crescent would collide with the theme toggle, and a glyph's
// rendering depends on the font. Two bars say "on hold" without either problem.
const PAUSE = '<svg class="glyph" viewBox="0 0 10 12" aria-hidden="true">'
  + '<rect x="1" y="1" width="3" height="10" rx="1.2" fill="currentColor"/>'
  + '<rect x="6" y="1" width="3" height="10" rx="1.2" fill="currentColor"/></svg>';

function whoHtml(pr) {
  const people = pr.contributors ?? [];
  if (!people.length) return '';

  const shown = people.slice(0, MAX_FACES);
  const hidden = people.length - shown.length;
  // Same behaviour as gitdeck: the face links to the GitHub profile. Every contributor
  // here has a login by construction — `contributorsOf` skips users without one — so
  // the link can never point at a page that does not exist.
  const faces = shown
    .map(
      person =>
        `<a class="face" href="https://github.com/${encodeURIComponent(person.login)}"`
        + ` target="_blank" rel="noopener"`
        + ` title="${escapeHtml(t('openProfile', { login: person.login }))}">`
        + (person.avatarUrl
          ? `<img src="${escapeHtml(person.avatarUrl)}&s=48" alt="" loading="lazy">`
          : '')
        + '</a>',
    )
    .join('');

  const names = shown.map(person => escapeHtml(person.login)).join(', ');

  return `<span class="sep who" title="${escapeHtml(people.map(p => p.login).join(' → '))}">`
    + `<span class="stack">${faces}</span>`
    + `<span>${names}${hidden ? ` +${hidden}` : ''}</span></span>`;
}

function ciPill(pr) {
  const map = {
    SUCCESS: ['good', 'ciOk'],
    FAILURE: ['alert', 'ciFail'],
    ERROR: ['alert', 'ciFail'],
    PENDING: ['', 'ciRunning'],
    EXPECTED: ['', 'ciRunning'],
  };
  const entry = map[pr.ciState];
  return entry ? pill(entry[0], t(entry[1])) : '';
}

function threadHtml(thread) {
  const file = thread.path ? thread.path.split('/').pop() : null;
  const label = file
    ? escapeHtml(file) + (thread.line ? ':' + thread.line : '')
    : t('conversation');
  return `
    <div class="thread">
      <div class="thread-head">
        <span class="thread-author">${escapeHtml(thread.author)}</span>
        <a class="thread-path" href="${escapeHtml(thread.url)}" target="_blank" rel="noreferrer"
           title="${escapeHtml(thread.path || '')}">${label}</a>
        ${thread.isOutdated ? pill('', t('outdated')) : ''}
        ${thread.commentCount > 1 ? `<span>${t('messages', { n: thread.commentCount })}</span>` : ''}
        <span>${t('lastWord', {
          who: escapeHtml(thread.lastByMe ? t('me') : thread.lastAuthor),
          ago: since(thread.lastAt),
        })}</span>
      </div>
      <div class="thread-body">${escapeHtml(thread.excerpt)}</div>
    </div>`;
}

// On a merged PR the release outcome owns the card's colour, overriding the bucket:
// the bucket says whose move it is, but here what matters is whether the release landed.
function pipelineClass(pr) {
  if (!pr.merged) return '';
  if (pr.mergePipeline === 'FAILURE' || pr.mergePipeline === 'ERROR') return ' pipeline-failed';
  if (pr.mergePipeline === 'SUCCESS') return ' pipeline-done';
  return ' pipeline-running';
}

function cardHtml(pr, threadsToShow, extraPills) {
  const open = state.open.has(pr.id) ? ' open' : '';
  const count = threadsToShow.length;

  return `
    <div class="card ${pr.bucket}${pipelineClass(pr)}${pr.approved ? ' approved' : ''}${state.snoozed.has(pr.id) ? ' snoozed' : ''}${open}" data-id="${pr.id}">
      <div class="card-top">
        <span class="repo">${escapeHtml(pr.repo.replace(/^.*\//, ''))} #${pr.number}</span>
        <a class="title" href="${escapeHtml(pr.url)}" target="_blank" rel="noreferrer">${escapeHtml(pr.title)}</a>
        <span class="age" title="${t('openedTitle', { date: onDate(pr.createdAt) })}">${t('opened', { v: ago(pr.createdAt) })}</span>
      </div>
      <div class="meta">
        ${pr.isDraft ? pill('', t('pillDraft')) : ''}
        ${extraPills.join('')}
        ${ciPill(pr)}
        ${pr.side === 'mine' && pr.mergeable === 'CONFLICTING' ? pill('alert', t('pillConflicts')) : ''}
        <span>+${pr.additions}/−${pr.deletions} · ${t('files', { n: pr.changedFiles })}</span>
        <span class="sep" title="${t('agoTitle')}">${t('activeAgo', { v: ago(pr.lastActivityAt) })}</span>
        ${whoHtml(pr)}
      </div>
      ${pr.displayReasons.length
        ? `<div class="reasons">${pr.displayReasons.map(r => `<div class="reason">${escapeHtml(r)}</div>`).join('')}</div>`
        : ''}
      <div class="card-foot">
        ${count ? `<button type="button" class="expander">${open ? '▾' : '▸'} ${tn('threads', count)}</button>` : '<span></span>'}
        <button type="button" class="snooze" title="${t('snooze')}" data-snooze="${pr.id}">${state.snoozed.has(pr.id) ? `${PAUSE} ${t('snoozedBadge')}` : PAUSE}</button>
      </div>
      ${count ? `<div class="threads">${threadsToShow.map(threadHtml).join('')}</div>` : ''}
    </div>`;
}

function resolveMine(pr) {
  const toFix = visibleThreads(pr.toFix);
  const waiting = visibleThreads(pr.waitingOnThem);
  // Remarks are recounted here: the "hide bots" filter can empty the list.
  const kept = pr.reasons.filter(r => r.kind !== 'threads');
  // On a merged PR the open threads are history; only the release still counts.
  const needsAction = kept.length > 0 || (!pr.merged && toFix.length > 0);

  // The pills already say the remark count, the CI and the conflicts: only the name of
  // the reviewer who requested changes adds something found nowhere else.
  const displayReasons = kept
    .filter(r => r.kind === 'changes-requested')
    .map(r => t('reasonChangesRequested', { authors: r.authors.join(', ') }));

  const bucket = needsAction
    ? 'action'
    : pr.merged
      ? 'merged'
      : waiting.length || pr.awaitingReview
        ? 'waiting'
        : 'idle';

  return {
    ...pr,
    toFix,
    waiting,
    displayReasons,
    needsAction,
    bucket,
    // Green means "signed off and settled": on my own PR, approved and nothing left.
    approved: bucket === 'idle' && pr.reviewDecision === 'APPROVED',
  };
}

function resolveReview(pr) {
  const answered = visibleThreads(pr.answeredToMe);
  const awaiting = visibleThreads(pr.awaitingAuthor);
  const awaitingFix = awaiting.length > 0 || pr.myLatestVerdict === 'CHANGES_REQUESTED';
  const toRecheck = pr.pushedSinceMyFeedback && awaitingFix;
  const toReview = pr.reasons.some(r => r.kind === 'to-review');
  const needsAction = toReview || answered.length > 0 || toRecheck;

  // Bot threads never enter answered/awaiting — I have not taken part in them — so on
  // the review side they were entirely invisible. On my own PRs they already land in
  // `toFix`, which is why this only shows here. Grouped per bot: 29 remarks from a
  // linter and 29 from a review bot do not call for the same thing.
  const botsByLogin = new Map();
  if (!el('hideBots').checked) {
    for (const thread of pr.threads) {
      if (!thread.fromBot || thread.isResolved) continue;
      const login = thread.author.replace(/\[bot\]$/, '');
      botsByLogin.set(login, (botsByLogin.get(login) ?? 0) + 1);
    }
  }
  const bots = [...botsByLogin.entries()]
    .map(([login, count]) => ({ login, count }))
    .sort((a, b) => b.count - a.count);

  const bucket = needsAction ? 'action' : awaitingFix ? 'waiting' : 'idle';

  return {
    ...pr,
    answered,
    bots,
    awaiting,
    displayReasons: toRecheck ? [t('reasonRecheck')] : [],
    needsAction,
    awaitingFix,
    bucket,
    approved: bucket === 'idle' && pr.myLatestVerdict === 'APPROVED',
  };
}

function mineCard(pr) {
  const pills = [];
  if (pr.merged) {
    pills.push(pill('', t('pillMergedAgo', { v: ago(pr.mergedAt) })));
    // Three outcomes, three readings: still running, published, broken.
    if (pr.mergePipeline === 'FAILURE' || pr.mergePipeline === 'ERROR') {
      pills.push(pill('alert', t('pipelineFailed')));
    } else if (pr.mergePipeline === 'SUCCESS') {
      pills.push(
        pr.release
          ? `<a class="pill good" href="${escapeHtml(pr.release.url)}" target="_blank" rel="noopener"`
            + ` title="${escapeHtml(t('releaseTag'))}">${escapeHtml(pr.release.tag)}</a>`
          : pill('good', t('pipelineDone')),
      );
    } else {
      pills.push(`<span class="pill pending running">${t('pipelineRunning')}</span>`);
    }
  }
  // A PR opened by someone else only lands here because I took it over: unsaid, its
  // presence in "my PRs" is unexplainable.
  if (pr.author !== state.data.me) pills.push(pill('', t('pillTakenOver', { author: pr.author })));
  if (!pr.merged && pr.toFix.length) pills.push(pill('todo', t('pillToFix', { n: pr.toFix.length })));
  if (!pr.merged && pr.reviewDecision === 'APPROVED') pills.push(pill('good', t('pillApproved')));
  if (!pr.merged && pr.waiting.length) pills.push(pill('pending', t('pillWaitingReply', { n: pr.waiting.length })));
  return cardHtml(pr, [...pr.toFix, ...pr.waiting], pills);
}

function reviewCard(pr) {
  const pills = [];
  if (pr.requestedFromMe && !pr.iHaveReviewed) pills.push(pill('todo', t('pillToReview')));
  if (pr.answered.length) pills.push(pill('todo', tn('pillAnswers', pr.answered.length)));
  if (pr.awaiting.length) pills.push(pill('pending', t('pillAwaitingFix', { n: pr.awaiting.length })));
  if (pr.myLatestVerdict === 'CHANGES_REQUESTED') pills.push(pill('pending', t('pillIRequested')));
  if (pr.myLatestVerdict === 'APPROVED') pills.push(pill('good', t('pillIApproved')));
  // When the card already carries the "new commits…" line, the pill merely repeats it.
  if (pr.pushedSinceMyFeedback && !pr.displayReasons.length) pills.push(pill('', t('pillPushed')));
  // Neutral: a bot having plenty to say is context, not something asked of me.
  for (const bot of pr.bots.slice(0, MAX_BOT_PILLS)) {
    pills.push(pill(
      '',
      `${escapeHtml(bot.login)} ${bot.count}`,
      tn('pillBotTitle', bot.count, { login: bot.login }),
    ));
  }
  return cardHtml(pr, [...pr.answered, ...pr.awaiting], pills);
}

// Clicking a counter isolates its set: the relevant column goes full width, the other
// disappears. One at a time — these are competing views of the same board, not filters
// that stack.
const FOCUS = {
  mineAction: { column: 'mine', bucket: 'action' },
  reviewAction: { column: 'reviews', bucket: 'action' },
  reviewWaiting: { column: 'reviews', bucket: 'waiting' },
};

function filterList(list) {
  let filtered = list;
  if (!state.revealSnoozed) filtered = filtered.filter(pr => !state.snoozed.has(pr.id));
  if (state.repo) filtered = filtered.filter(pr => pr.repo === state.repo);
  if (el('hideDrafts').checked) filtered = filtered.filter(pr => !pr.isDraft);
  // Focus wins over the "needs work" checkbox: combined they could contradict each
  // other (focusing "awaiting" with the box ticked = a permanently empty list).
  if (!state.focus && el('onlyAction').checked) filtered = filtered.filter(pr => pr.needsAction);
  return filtered;
}

function renderColumn(target, list, cardFn, groupLabels, emptyLabel, onlyBucket) {
  const filtered = filterList(list).filter(pr => !onlyBucket || pr.bucket === onlyBucket);
  if (!filtered.length) {
    target.innerHTML = `<div class="empty">${emptyLabel}</div>`;
    return;
  }
  // Ordered by what each state asks of you: your move, then waiting on someone, then a
  // merge to glance at, then nothing. A merge sat second before, which ranked a
  // published release above a PR actually blocked on a reviewer.
  target.innerHTML = ['action', 'waiting', 'merged', 'idle']
    .map(bucket => {
      const group = filtered.filter(pr => pr.bucket === bucket);
      if (!group.length) return '';
      // A summary reports the state that still needs attention: the merged group turns
      // green only once every release in it has landed. A failed one is not here — it
      // moves to the action group.
      const settled = bucket === 'merged' && group.every(pr => pr.mergePipeline === 'SUCCESS');
      return `<div class="group-label ${bucket}${settled ? ' settled' : ''}">`
        + `<span class="gdot"></span>${groupLabels[bucket]}`
        + `<span class="gcount">${group.length}</span></div>`
        + group.map(cardFn).join('');
    })
    .join('');
}

function repoOptions() {
  const query = state.repoQuery.trim().toLowerCase();
  const shortName = repo => repo.replace(/^.*\//, '');
  const all = { repo: null, label: t('allProjects', { n: state.repoTotal }), count: null };
  const matching = state.repos
    .filter(entry => !query || shortName(entry.repo).toLowerCase().includes(query))
    .map(entry => ({ repo: entry.repo, label: shortName(entry.repo), count: entry.count }));

  return query ? matching : [all, ...matching];
}

function renderRepoTrigger() {
  const label = state.repo
    ? `${state.repo.replace(/^.*\//, '')} (${state.repos.find(e => e.repo === state.repo)?.count ?? 0})`
    : t('allProjects', { n: state.repoTotal });

  const trigger = el('repoTrigger');
  trigger.innerHTML = `<span>${escapeHtml(label)}</span><span class="caret">▾</span>`;
  trigger.classList.toggle('on', Boolean(state.repo));
  trigger.setAttribute('aria-expanded', String(state.repoOpen));
}

// Rebuilt on its own so typing never blows away the search field's focus.
function renderRepoList() {
  const options = repoOptions();
  state.repoActive = Math.min(state.repoActive, Math.max(0, options.length - 1));

  el('repoList').innerHTML = options.length
    ? options
        .map((option, index) => {
          const selected = (option.repo ?? null) === state.repo;
          return `<button type="button" class="picker-option${index === state.repoActive ? ' active' : ''}"`
            + ` role="option" aria-selected="${selected}" data-repo="${escapeHtml(option.repo ?? '')}">`
            + `<span class="label">${escapeHtml(option.label)}</span>`
            + `${option.count === null ? '' : `<span class="n">${option.count}</span>`}</button>`;
        })
        .join('')
    : `<div class="picker-empty">${t('noProject')}</div>`;
}

function openRepoPicker(open) {
  state.repoOpen = open;
  state.repoQuery = '';
  state.repoActive = 0;
  el('repoPanel').hidden = !open;
  el('repoSearch').value = '';
  el('repoSearch').placeholder = t('searchProject');
  el('repoTrigger').setAttribute('aria-expanded', String(open));
  if (!open) return;
  renderRepoList();
  el('repoSearch').focus();
}

function pickRepo(repo) {
  state.repo = repo || null;
  openRepoPicker(false);
  render();
}

const counter = (key, kind, value, label) => {
  const active = state.focus === key;
  const classes = ['counter', kind, value ? '' : 'zero', active ? 'on' : ''].filter(Boolean);
  // A counter at zero would only filter to nothing: better not to offer it.
  return `<button type="button" class="${classes.join(' ')}" data-focus="${key}"`
    + `${value ? '' : ' disabled'}`
    + `${value ? ` title="${t(active ? 'focusClear' : 'focusHint')}"` : ''}>`
    + `<span class="dot"></span><b>${value}</b> ${label}`
    + `<span class="go">${active ? '×' : '›'}</span></button>`;
};

function render() {
  const data = state.data;
  if (!data) return;

  el('scope').textContent = `${data.org} · @${data.me}`;

  const mine = data.mine.map(resolveMine);
  const reviews = data.reviews.map(resolveReview);
  // Judged on the resolved list, so the rule and the button agree on what "asks for
  // action" means — the raw payload's needsAction ignores the "hide bots" filter.
  state.snoozed = snoozes.applicable([...mine, ...reviews]);

  const mineAction = filterList(mine).filter(pr => pr.needsAction).length;
  const reviewAction = filterList(reviews).filter(pr => pr.needsAction).length;
  const waitingFix = filterList(reviews).filter(pr => pr.bucket === 'waiting').length;
  const total = mineAction + reviewAction;

  el('counters').innerHTML = [
    counter('mineAction', 'todo', mineAction, t('counterMine')),
    counter('reviewAction', 'todo', reviewAction, tn('counterReviews', reviewAction)),
    counter('reviewWaiting', 'pending', waitingFix, t('counterWaiting')),
  ].join('');

  // With no href the CSS hides the link: an empty URL removes it from the header.
  if (data.gitdeckUrl) el('gitdeck').href = data.gitdeckUrl;
  else el('gitdeck').removeAttribute('href');

  const warnings = data.warnings ?? [];
  el('warning').hidden = warnings.length === 0;
  if (warnings.length) {
    const sources = [...new Set(warnings.map(w => w.source))];
    el('warning').textContent = tn('warning', sources.length, { sources: sources.join(', ') });
  }

  const asleep = state.snoozed.size;
  el('snoozedNote').innerHTML = asleep
    ? `<button type="button" class="counter asleep${state.revealSnoozed ? ' on' : ''}" data-reveal`
      + ` title="${t(state.revealSnoozed ? 'snoozedHide' : 'snoozedShow')}">`
      + `${PAUSE}<b>${asleep}</b> ${t('snoozedBadge')}`
      + `<span class="go">${state.revealSnoozed ? '×' : '›'}</span></button>`
      + (state.revealSnoozed
        ? `<button type="button" class="wake" data-wake>${t('snoozedWake')}</button>`
        : '')
    : '';

  const hidden = data.counts.hiddenStale;
  el('stale').textContent = hidden ? tn('stale', hidden, { days: data.maxAgeDays }) : '';

  document.title = total ? `(${total}) PR Radar` : 'PR Radar';
  applyStampTitle();
  const fetchedAt = new Date(data.fetchedAt);
  el('stamp').textContent = fetchedAt.toLocaleTimeString(LOCALE[lang], { hour: '2-digit', minute: '2-digit' });
  // A failed fetch raises the banner; a merely late one would age in silence.
  el('stamp').classList.toggle(
    'aged',
    Date.now() - fetchedAt > (data.refreshSeconds ?? 300) * 2000,
  );

  // Only the projects actually on the board, so the list never offers an empty result.
  const all = [...data.mine, ...data.reviews];
  const perRepo = new Map();
  for (const pr of all) perRepo.set(pr.repo, (perRepo.get(pr.repo) ?? 0) + 1);
  if (state.repo && !perRepo.has(state.repo)) state.repo = null;

  const repos = [...perRepo.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  state.repos = repos.map(([repo, count]) => ({ repo, count }));
  state.repoTotal = all.length;
  renderRepoTrigger();
  if (state.repoOpen) renderRepoList();

  const focus = FOCUS[state.focus];
  document.querySelector('main').dataset.focus = focus ? focus.column : '';

  renderColumn(el('mine'), mine, mineCard, {
    action: t('groupMineAction'),
    merged: t('groupMineMerged'),
    waiting: t('groupMineWaiting'),
    idle: t('groupIdle'),
  }, t('emptyMine'), focus?.column === 'mine' ? focus.bucket : null);

  renderColumn(el('reviews'), reviews, reviewCard, {
    action: t('groupReviewAction'),
    waiting: t('groupReviewWaiting'),
    idle: t('groupIdle'),
  }, t('emptyReviews'), focus?.column === 'reviews' ? focus.bucket : null);

  if (state.lastActionCount !== null && total > state.lastActionCount) beep();
  state.lastActionCount = total;
}

function renderSkeleton() {
  el('mine').innerHTML = '<div class="card skeleton"></div>'.repeat(3);
  el('reviews').innerHTML = '<div class="card skeleton"></div>'.repeat(2);
}

async function load(force) {
  el('refresh').classList.add('busy');
  try {
    const response = await fetch('/api/prs' + (force ? '?force=1' : ''));
    const version = response.headers.get('x-pr-radar-version');
    if (version) {
      bootVersion ??= version;
      if (version !== bootVersion) el('reload').hidden = false;
    }

    const payload = await response.json();
    if (!response.ok) throw new Error(payload.error || response.statusText);
    el('error').hidden = true;
    state.data = payload;
    el('summary').hidden = false;
    scheduleRefresh(payload.refreshSeconds);
    render();
  } catch (error) {
    el('error').hidden = false;
    el('error').textContent = t('error', { message: error.message });
    // A first load that fails must not leave a sweeping skeleton pretending to work.
    if (!state.data) {
      el('mine').innerHTML = '';
      el('reviews').innerHTML = '';
    }
  } finally {
    el('refresh').classList.remove('busy');
  }
}

document.addEventListener('click', event => {
  const snoozeButton = event.target.closest('.snooze');
  if (snoozeButton) {
    const { snooze } = snoozeButton.dataset;
    const pr = [...state.data.mine, ...state.data.reviews].find(entry => entry.id === snooze);
    if (state.snoozed.has(snooze)) {
      const map = snoozes.read();
      delete map[snooze];
      snoozes.write(map);
    } else if (pr) {
      snoozes.add(pr);
    }
    render();
    return;
  }

  if (event.target.closest('[data-reveal]')) {
    state.revealSnoozed = !state.revealSnoozed;
    render();
    return;
  }

  if (event.target.closest('[data-wake]')) {
    snoozes.clear();
    state.revealSnoozed = false;
    render();
    return;
  }

  const option = event.target.closest('.picker-option');
  if (option) {
    pickRepo(option.dataset.repo);
    return;
  }
  // composedPath is captured at dispatch time, so it still holds nodes that a re-render
  // has since detached — `closest` on the target alone would miss them.
  const insidePicker = event.composedPath().some(node => node.id === 'picker');
  if (state.repoOpen && !insidePicker) openRepoPicker(false);

  const focusButton = event.target.closest('.counter');
  if (focusButton) {
    const { focus } = focusButton.dataset;
    state.focus = state.focus === focus ? null : focus;
    render();
    return;
  }

  const expander = event.target.closest('.expander');
  if (!expander) return;
  const { id } = expander.closest('.card').dataset;
  if (state.open.has(id)) state.open.delete(id);
  else state.open.add(id);
  render();
});

document.addEventListener('keydown', event => {
  if (event.key !== 'Escape') return;
  if (state.repoOpen) {
    openRepoPicker(false);
    el('repoTrigger').focus();
    return;
  }
  if (!state.focus) return;
  state.focus = null;
  render();
});

// A laptop waking from sleep leaves setInterval far behind: without this you read
// forty-minute-old data believing it is fresh. The server cache absorbs the extra call.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') load(false);
});

el('repoTrigger').addEventListener('click', () => openRepoPicker(!state.repoOpen));

el('repoSearch').addEventListener('input', event => {
  state.repoQuery = event.target.value;
  state.repoActive = 0;
  renderRepoList();
});

el('repoSearch').addEventListener('keydown', event => {
  const options = repoOptions();
  if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
    event.preventDefault();
    const step = event.key === 'ArrowDown' ? 1 : -1;
    state.repoActive = (state.repoActive + step + options.length) % Math.max(1, options.length);
    renderRepoList();
    return;
  }
  if (event.key === 'Enter' && options[state.repoActive]) {
    event.preventDefault();
    pickRepo(options[state.repoActive].repo);
  }
});

el('reload').addEventListener('click', () => location.reload());
el('refresh').addEventListener('click', () => load(true));
applyLang(lang);
renderSkeleton();
load(false);
</script>
</body>
</html>
