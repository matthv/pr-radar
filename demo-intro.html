<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Radar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Cpath%20d='M16,16L16,4.5A11.5,11.5,0,0,1,25.96,10.25Z'%20fill='%23514ab8'%20opacity='.3'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='12.6'%20fill='none'%20stroke='%23514ab8'%20stroke-width='2.4'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='6.8'%20fill='none'%20stroke='%23514ab8'%20stroke-width='1.7'%20opacity='.38'/%3E%3Ccircle%20cx='20.6'%20cy='9.45'%20r='3.6'%20fill='%23514ab8'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f6fb;
    --glow: #e9e7fd;
    --text: #1d1e28;
    --text-faint: #8e91a6;
    --ring: #5a51d4;
    --sweep: 90, 81, 212;
    --indigo: #5a51d4;
    --emerald: #2fb389;
    --amber: #d99a1e;
    --rose: #e0716c;
    --cyan: #2aa5c0;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #101219;
    --glow: #1e1b3d;
    --text: #e7e8f0;
    --text-faint: #757a92;
    --ring: #a29bf5;
    --sweep: 162, 155, 245;
    --indigo: #a29bf5;
    --emerald: #5fcda6;
    --amber: #f0cd91;
    --rose: #f0a29e;
    --cyan: #7fd3e6;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid; place-items: center;
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, sans-serif;
    color: var(--text);
    background: radial-gradient(900px 520px at 50% 38%, var(--glow) 0%, transparent 70%), var(--bg);
    cursor: pointer; overflow: hidden;
  }

  main { display: flex; flex-direction: column; align-items: center; gap: 40px; padding-inline: 16px; }

  .radar { --size: min(46vh, 380px); --turn: 4.5s; position: relative; width: var(--size); aspect-ratio: 1; max-width: 100%; }
  .radar svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .sweep {
    position: absolute; inset: 4%; border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(var(--sweep), 0) 0deg 290deg, rgba(var(--sweep), .38) 360deg);
    animation: spin var(--turn) linear infinite;
  }
  .sweep::after {
    content: ""; position: absolute; left: 50%; top: 0; width: 2px; height: 50%;
    transform: translateX(-50%); background: linear-gradient(to top, rgba(var(--sweep), 0), rgba(var(--sweep), .9));
  }
  .blip {
    position: absolute; width: 4.2%; aspect-ratio: 1; border-radius: 50%;
    transform: translate(-50%, -50%); background: var(--c);
    box-shadow: 0 0 0 0 var(--c);
    opacity: .14;
    animation: ping var(--turn) ease-out infinite;
    animation-delay: calc(var(--a) / 360 * var(--turn));
  }

  h1 { margin: 0; font-size: clamp(44px, 8vw, 84px); font-weight: 720; letter-spacing: -.035em; line-height: 1; text-wrap: balance; }
  .hint {
    position: fixed; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; text-align: center;
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-faint);
    opacity: 0; animation: appear .8s 2.5s forwards;
  }
  kbd { font: inherit; padding: 1px 6px; border: 1px solid currentColor; border-radius: 5px; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes ping {
    0% { opacity: 1; box-shadow: 0 0 0 0 var(--c); }
    12% { box-shadow: 0 0 0 calc(var(--size) * .03) transparent; }
    70%, 100% { opacity: .14; box-shadow: 0 0 0 0 transparent; }
  }
  @keyframes appear { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .sweep { animation: none; }
    .blip { animation: none; opacity: .8; }
  }
</style>
</head>
<body>
<main>
  <div class="radar" aria-hidden="true">
    <svg viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="14.4" fill="none" stroke="var(--ring)" stroke-width=".55" opacity=".55"/>
      <circle cx="16" cy="16" r="9.6" fill="none" stroke="var(--ring)" stroke-width=".35" opacity=".3"/>
      <circle cx="16" cy="16" r="4.8" fill="none" stroke="var(--ring)" stroke-width=".3" opacity=".22"/>
      <line x1="16" y1="1.6" x2="16" y2="30.4" stroke="var(--ring)" stroke-width=".2" opacity=".18"/>
      <line x1="1.6" y1="16" x2="30.4" y2="16" stroke="var(--ring)" stroke-width=".2" opacity=".18"/>
      <circle cx="16" cy="16" r=".7" fill="var(--ring)" opacity=".6"/>
    </svg>
    <div class="sweep"></div>
    <div id="blips"></div>
  </div>
  <h1>PR Radar</h1>
</main>
<p class="hint"><kbd>Espace</kbd> pour commencer</p>
<script>
  try {
    document.documentElement.dataset.theme = localStorage.getItem('pr-radar:theme') === 'dark' ? 'dark' : 'light';
  } catch {}

  // One blip per state the board draws, each lit as the sweep crosses its bearing.
  const BLIPS = [
    [38, .62, 'indigo'], [96, .38, 'emerald'], [148, .78, 'amber'],
    [205, .5, 'indigo'], [262, .7, 'rose'], [318, .3, 'cyan'], [12, .9, 'emerald'],
  ];
  document.getElementById('blips').innerHTML = BLIPS.map(([angle, distance, colour]) => {
    const rad = (angle - 90) * Math.PI / 180;
    const x = 50 + Math.cos(rad) * distance * 45;
    const y = 50 + Math.sin(rad) * distance * 45;
    return `<span class="blip" style="left:${x}%;top:${y}%;--a:${angle};--c:var(--${colour})"></span>`;
  }).join('');

  const start = () => { location.href = '/'; };
  document.addEventListener('click', start);
  document.addEventListener('keydown', event => {
    if ([' ', 'Enter', 'ArrowRight', 'PageDown'].includes(event.key)) { event.preventDefault(); start(); }
  });
</script>
</body>
</html>
